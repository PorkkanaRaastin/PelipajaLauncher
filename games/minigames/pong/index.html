<!doctype html>
<html lang="fi">
<head><meta charset="utf-8"><title>Pong</title></head>
<body>
<script src="../_mini.js"></script>
<script>
// Pong kahdelle: ensimmäinen 7 pisteeseen voittaa
const { W, H, C, key, beep, text, rect, circle, over, shake, clamp } = Mini;
const WIN = 7, PW = 16, PH = 100, TOP = 50;
let p1, p2, ball, serveT, trail, hits;

function serve(dir) {
  ball = { x: W / 2, y: (TOP + H) / 2, vx: 0, vy: 0, r: 9, dir };
  serveT = 0.9;
  hits = 0;
}

Mini.run({
  id: "pong",
  title: "Pong",
  description: "Klassikko kahdelle. Ensimmäinen seitsemään pisteeseen voittaa.",
  players: 2,
  controls: [
    ["Pelaaja 1", ["W", "S"], "liiku ylös / alas", C.p1],
    ["Pelaaja 2", ["↑", "↓"], "liiku ylös / alas", C.p2],
  ],
  reset() {
    p1 = { y: (TOP + H) / 2, score: 0 };
    p2 = { y: (TOP + H) / 2, score: 0 };
    trail = [];
    serve(Math.random() < 0.5 ? -1 : 1);
  },
  coverSetup() {
    p1.y = 260; p2.y = 380; p1.score = 4; p2.score = 3;
    ball = { x: 600, y: 300, vx: 1, vy: 0, r: 9 };
    for (let i = 0; i < 12; i++) trail.push({ x: 600 - i * 14, y: 300 - i * 6 });
  },
  update(dt) {
    const sp = 520;
    p1.y += ((key("KeyS") ? 1 : 0) - (key("KeyW") ? 1 : 0)) * sp * dt;
    p2.y += ((key("ArrowDown") ? 1 : 0) - (key("ArrowUp") ? 1 : 0)) * sp * dt;
    p1.y = clamp(p1.y, TOP + PH / 2, H - PH / 2);
    p2.y = clamp(p2.y, TOP + PH / 2, H - PH / 2);

    if (serveT > 0) {
      serveT -= dt;
      if (serveT <= 0) {
        const a = Mini.rand(-0.5, 0.5);
        ball.vx = Math.cos(a) * 420 * ball.dir;
        ball.vy = Math.sin(a) * 420;
      }
      return;
    }
    const steps = 3;
    for (let s = 0; s < steps; s++) {
      ball.x += (ball.vx * dt) / steps;
      ball.y += (ball.vy * dt) / steps;
      if (ball.y < TOP + ball.r) { ball.y = TOP + ball.r; ball.vy = Math.abs(ball.vy); beep(330, 0.03); }
      if (ball.y > H - ball.r) { ball.y = H - ball.r; ball.vy = -Math.abs(ball.vy); beep(330, 0.03); }
      // mailat
      for (const [p, x, side] of [[p1, 40, 1], [p2, W - 40, -1]]) {
        const inX = side === 1 ? ball.x - ball.r < x + PW / 2 && ball.x > x - PW : ball.x + ball.r > x - PW / 2 && ball.x < x + PW;
        if (inX && Math.abs(ball.y - p.y) < PH / 2 + ball.r && Math.sign(ball.vx) === -side) {
          const off = (ball.y - p.y) / (PH / 2);
          hits++;
          const speed = Math.min(980, 420 + hits * 28);
          const ang = clamp(off, -1, 1) * 0.9;
          ball.vx = Math.cos(ang) * speed * side;
          ball.vy = Math.sin(ang) * speed;
          ball.x = x + side * (PW / 2 + ball.r);
          beep(520 + hits * 10, 0.05, "square", 0.05);
        }
      }
    }
    trail.unshift({ x: ball.x, y: ball.y });
    trail.length = Math.min(trail.length, 12);
    if (ball.x < -20 || ball.x > W + 20) {
      const scorer = ball.x < 0 ? p2 : p1;
      scorer.score++;
      shake(8, 0.2);
      beep(scorer === p1 ? 660 : 440, 0.2, "triangle", 0.05, 200);
      trail = [];
      if (scorer.score >= WIN) {
        const p1won = scorer === p1;
        over({ title: p1won ? "Pelaaja 1 voitti!" : "Pelaaja 2 voitti!", color: p1won ? C.p1 : C.p2, lines: [`${p1.score} – ${p2.score}`] });
        return;
      }
      serve(scorer === p1 ? 1 : -1);
    }
  },
  draw(ctx) {
    rect(0, 0, W, TOP, C.panel);
    for (let y = TOP + 10; y < H; y += 28) rect(W / 2 - 2, y, 4, 14, C.line);
    text(String(p1.score), W / 2 - 60, 25, 30, C.p1, "right", 800);
    text(String(p2.score), W / 2 + 60, 25, 30, C.p2, "left", 800);
    text("–", W / 2, 25, 24, C.muted, "center", 800);
    text("PELAAJA 1", 40, 25, 13, C.p1, "left", 800);
    text("PELAAJA 2", W - 40, 25, 13, C.p2, "right", 800);
    trail.forEach((t, i) => { ctx.globalAlpha = 0.25 * (1 - i / 12); circle(t.x, t.y, ball.r * (1 - i / 16), C.text); });
    ctx.globalAlpha = 1;
    rect(40 - PW / 2, p1.y - PH / 2, PW, PH, C.p1, 6);
    rect(W - 40 - PW / 2, p2.y - PH / 2, PW, PH, C.p2, 6);
    circle(ball.x, ball.y, ball.r, C.text);
    if (serveT > 0 && Mini.state === "play") text("Valmiina…", W / 2, (TOP + H) / 2 - 50, 18, C.muted, "center", 700);
  },
});
</script>
</body>
</html>
