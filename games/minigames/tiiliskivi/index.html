<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Brick Breaker</title></head>
<body>
<script src="../_mini.js"></script>
<script>
// Tiiliskivi: riko kaikki tiilet pallolla, älä päästä palloa ohi
const { W, H, C, key, mouse, beep, text, rect, circle, submitScore, best, over, shake, clamp } = Mini;
const ROW_COLORS = ["#e5534b", "#f0883e", "#f0b429", "#3fbf5f", "#2fb9a0", "#4aa3ff"];
let pad, balls, bricks, lives, score, level, launched, particles, useMouse;

function makeLevel(n) {
  bricks = [];
  const cols = 12, rows = Math.min(6, 4 + n), bw = 70, bh = 24, gap = 6;
  const ox = (W - cols * (bw + gap) + gap) / 2;
  for (let r = 0; r < rows; r++)
    for (let c = 0; c < cols; c++) {
      if (n >= 2 && (r + c) % 5 === 0 && r > 0) continue; // kuvio tasoille 2+
      bricks.push({ x: ox + c * (bw + gap), y: 80 + r * (bh + gap), w: bw, h: bh, hp: r === 0 && n >= 2 ? 2 : 1, color: ROW_COLORS[r % 6] });
    }
}
function newBall() {
  balls = [{ x: pad.x, y: pad.y - 14, vx: 0, vy: 0, r: 8 }];
  launched = false;
}

Mini.run({
  id: "tiiliskivi",
  title: "Brick Breaker",
  description: "Bounce the ball with the paddle and break every brick. Three lives.",
  players: 1,
  controls: [[null, ["A", "D"], "or ← → (or mouse): move"], [null, ["Space"], "launch the ball"]],
  reset() {
    pad = { x: W / 2, y: H - 40, w: 120, h: 14 };
    lives = 3; score = 0; level = 1; particles = []; useMouse = false;
    mouse.moved = false;
    makeLevel(level);
    newBall();
  },
  coverSetup() {
    bricks = bricks.filter((b, i) => i % 7 !== 3 && i % 11 !== 5);
    balls = [{ x: 560, y: 380, vx: 0, vy: 0, r: 8 }];
    pad.x = 520;
  },
  update(dt) {
    const speed = 640;
    if (key("KeyA", "ArrowLeft")) { pad.x -= speed * dt; useMouse = false; }
    if (key("KeyD", "ArrowRight")) { pad.x += speed * dt; useMouse = false; }
    if (mouse.moved) { useMouse = true; mouse.moved = false; }
    if (useMouse) pad.x = mouse.x;
    pad.x = clamp(pad.x, pad.w / 2 + 10, W - pad.w / 2 - 10);

    if (!launched) {
      balls[0].x = pad.x; balls[0].y = pad.y - 14;
      if (Mini.pressed("Space", "KeyW", "ArrowUp") || mouse.clicked) {
        launched = true;
        const sp = 380 + level * 30;
        balls[0].vx = sp * 0.45 * (Math.random() < 0.5 ? -1 : 1);
        balls[0].vy = -sp;
        beep(440, 0.05);
      }
    }

    for (const b of balls) {
      if (!launched) break;
      // pienissä askelissa, ettei pallo mene tiilen läpi
      const steps = Math.ceil((Math.hypot(b.vx, b.vy) * dt) / 6);
      for (let s = 0; s < steps; s++) {
        b.x += (b.vx * dt) / steps;
        b.y += (b.vy * dt) / steps;
        if (b.x < b.r) { b.x = b.r; b.vx = Math.abs(b.vx); beep(300, 0.03); }
        if (b.x > W - b.r) { b.x = W - b.r; b.vx = -Math.abs(b.vx); beep(300, 0.03); }
        if (b.y < b.r + 40) { b.y = b.r + 40; b.vy = Math.abs(b.vy); beep(300, 0.03); }
        // maila
        if (b.vy > 0 && b.y + b.r >= pad.y - pad.h / 2 && b.y < pad.y + pad.h && Math.abs(b.x - pad.x) < pad.w / 2 + b.r) {
          const off = (b.x - pad.x) / (pad.w / 2);
          const sp = Math.min(820, Math.hypot(b.vx, b.vy) * 1.015);
          const ang = clamp(off, -1, 1) * 1.05;
          b.vx = Math.sin(ang) * sp;
          b.vy = -Math.cos(ang) * sp;
          b.y = pad.y - pad.h / 2 - b.r;
          beep(520, 0.04);
        }
        // tiilet
        for (const br of bricks) {
          if (br.hp <= 0) continue;
          const nx = clamp(b.x, br.x, br.x + br.w), ny = clamp(b.y, br.y, br.y + br.h);
          if ((b.x - nx) ** 2 + (b.y - ny) ** 2 > b.r * b.r) continue;
          const ovX = Math.min(b.x + b.r - br.x, br.x + br.w - (b.x - b.r));
          const ovY = Math.min(b.y + b.r - br.y, br.y + br.h - (b.y - b.r));
          if (ovX < ovY) b.vx = b.x < br.x + br.w / 2 ? -Math.abs(b.vx) : Math.abs(b.vx);
          else b.vy = b.y < br.y + br.h / 2 ? -Math.abs(b.vy) : Math.abs(b.vy);
          br.hp--;
          if (br.hp <= 0) {
            score += 10 * level;
            beep(700 + Math.random() * 200, 0.05, "square", 0.04);
            for (let i = 0; i < 10; i++)
              particles.push({ x: br.x + br.w / 2, y: br.y + br.h / 2, vx: Mini.rand(-160, 160), vy: Mini.rand(-160, 160), life: 0.5, color: br.color });
          } else beep(400, 0.05);
          break;
        }
      }
    }
    // pallo putosi
    if (launched && balls[0].y > H + 20) {
      lives--;
      shake(8, 0.25);
      beep(160, 0.25, "sawtooth", 0.05, -60);
      if (lives <= 0) {
        const isBest = submitScore(score);
        over({ title: "Game over", color: C.danger, lines: [`Score: ${score}  ·  Level ${level}`, isBest ? "New best!" : `Best: ${best()}`] });
        return;
      }
      newBall();
    }
    if (bricks.every((b) => b.hp <= 0)) {
      level++;
      score += 100;
      beep(880, 0.2, "triangle", 0.05, 400);
      makeLevel(level);
      newBall();
    }
    for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 400 * dt; p.life -= dt; }
    particles = particles.filter((p) => p.life > 0);
  },
  draw(ctx) {
    Mini.grid();
    rect(0, 0, W, 40, C.panel);
    for (const br of bricks) {
      if (br.hp <= 0) continue;
      rect(br.x, br.y, br.w, br.h, br.color, 5);
      rect(br.x, br.y, br.w, 6, "rgba(255,255,255,0.18)", [5, 5, 0, 0]);
      if (br.hp > 1) rect(br.x + 4, br.y + 4, br.w - 8, br.h - 8, "rgba(0,0,0,0.25)", 3);
    }
    for (const p of particles) rect(p.x - 3, p.y - 3, 6, 6, p.color);
    rect(pad.x - pad.w / 2, pad.y - pad.h / 2, pad.w, pad.h, C.accent, 7);
    rect(pad.x - pad.w / 2, pad.y + pad.h / 2 - 4, pad.w, 4, C.accentDark, [0, 0, 7, 7]);
    for (const b of balls) circle(b.x, b.y, b.r, C.text);
    text(`Score ${score}`, W - 24, 20, 18, C.text, "right", 800);
    text(`Level ${level}`, W / 2, 20, 16, C.muted, "center", 700);
    for (let i = 0; i < lives; i++) circle(W - 220 - i * 22, 20, 7, C.accent);
    if (!launched && Mini.state === "play") text("Space = launch", W / 2, H - 90, 16, C.muted, "center", 600);
  },
});
</script>
</body>
</html>
