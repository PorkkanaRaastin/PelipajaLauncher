<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pizza Moped</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#1a1a22;font-family:"Segoe UI",system-ui,sans-serif;color:#fff6ea}
canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh}
#hud{position:fixed;left:0;right:0;top:12px;display:flex;justify-content:center;gap:10px;pointer-events:none;z-index:5}
#hud[hidden],.pp[hidden],#order[hidden]{display:none}
.pill{background:rgba(20,16,14,.74);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:8px 14px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px}
.pill small{font-weight:700;color:#d8c8b4;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
#time.low{color:#ff8c6a}
#qbar{width:110px;height:8px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}#qfill{height:100%;background:#7ee081;width:0}
#order{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:rgba(20,16,14,.74);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:8px 16px;font-weight:800;font-size:14px;pointer-events:none;z-index:5;text-align:center}
#order span{color:#ffcf6a}
#tilt{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:260px;height:44px;pointer-events:none;z-index:5;background:rgba(20,16,14,.74);border:1px solid rgba(255,255,255,.12);border-radius:12px}
#tilt[hidden]{display:none}
#tilt b{position:absolute;left:0;right:0;top:4px;text-align:center;font-size:11px;letter-spacing:.1em;color:#d8c8b4}
#tiltTrack{position:absolute;left:16px;right:16px;bottom:9px;height:12px;border-radius:8px;background:linear-gradient(90deg,#e5534b 0 12%,#f0b429 12% 28%,#3fbf5f 28% 72%,#f0b429 72% 88%,#e5534b 88%)}
#tiltNeedle{position:absolute;bottom:5px;width:6px;height:20px;margin-left:-3px;border-radius:3px;background:#fff;left:50%}
.pp{position:fixed;bottom:14px;pointer-events:none;z-index:5;background:rgba(20,16,14,.74);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:8px 14px;font-weight:800;font-size:14px;max-width:270px}
.pp b{display:flex;align-items:center;gap:8px}.pp b i{width:11px;height:11px;border-radius:50%}
.pp span{display:block;color:#d8c8b4;font-size:12px;font-weight:700;margin-top:3px}
#pp1{left:14px}#pp2{right:14px}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="ov"></canvas>
<div id="hud" hidden>
  <div class="pill"><small id="lvName">Shift 1</small></div>
  <div class="pill"><small>Shift time left</small><span id="time">3:00</span></div>
  <div class="pill"><small>Earned</small><span id="money">0 €</span><div id="qbar"><div id="qfill"></div></div><small id="quota">/ 60 €</small></div>
</div>
<div id="order" hidden></div>
<div id="tilt" hidden><b>PIZZA STACK BALANCE</b><div id="tiltTrack"></div><div id="tiltNeedle"></div></div>
<div class="pp" id="pp1" hidden><b><i style="background:#ff8a3d"></i>PATE · STEERING</b><span id="k1"></span></div>
<div class="pp" id="pp2" hidden><b><i style="background:#33d1c4"></i>MASA · THROTTLE &amp; PIZZAS</b><span id="k2"></span></div>

<script src="../_shared/three.min.js"></script>
<script src="../_shared/peerjs.min.js"></script>
<script src="../_shared/coop.js"></script>
<script>
// Mopolähetti – kaksi kuskia, yksi mopo ja huojuva pizzapino.
(() => {
"use strict";
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const pick = (a) => a[Math.floor(Math.random() * a.length)];
function mulberry32(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

const BLK = 300, RD = 130, CELL = BLK + RD; // kortteli, tie, ruutu
const N = 5;                                 // 5×5 korttelia
const SIZE = N * CELL + RD;
const COLS = ["#ff8a3d", "#33d1c4"];
const STREETS = ["Gull Lane", "Pizza Path", "Bump Road", "Throttle Street", "Moped Hill", "Cheese Crescent", "Hinge Street", "Corner Lane", "Salami Lane", "Beach Boulevard"];
function shift(lv) { return { quota: 60 + (lv - 1) * 35, time: 180, gulls: Math.min(7, 2 + lv), cars: Math.min(9, 3 + lv), maxStack: Math.min(5, 2 + Math.ceil(lv / 2)) }; }

// ---------- maailma ----------
let blocks = [], houses = [], bumps = [], cones = [], pizzeria = null, S = null;
const roadCenter = (i) => RD / 2 + i * CELL; // i:s tie (0..N)
function buildCity(seed, lv) {
  const R = mulberry32(seed);
  S = shift(lv);
  blocks = []; houses = []; bumps = []; cones = [];
  for (let bx = 0; bx < N; bx++)
    for (let bz = 0; bz < N; bz++) {
      const x0 = RD + bx * CELL, z0 = RD + bz * CELL;
      const blk = { x0, z0, x1: x0 + BLK, z1: z0 + BLK, park: R() < 0.12, b: [] };
      blocks.push(blk);
      if (blk.park) continue;
      // talot korttelin reunoille, ovet kadulle päin
      const per = 2;
      for (let side = 0; side < 4; side++)
        for (let k = 0; k < per; k++) {
          const w = 110 + R() * 20, d = 80 + R() * 40, h = 40 + R() * 110;
          let x, z, dx = 0, dz = 0;
          const off = 20 + k * (BLK / per) + R() * 10;
          if (side === 0) { x = x0 + off + w / 2; z = z0 + d / 2 + 8; dz = -1; }
          else if (side === 1) { x = x0 + off + w / 2; z = z0 + BLK - d / 2 - 8; dz = 1; }
          else if (side === 2) { x = x0 + d / 2 + 8; z = z0 + off + w / 2; dx = -1; }
          else { x = x0 + BLK - d / 2 - 8; z = z0 + off + w / 2; dx = 1; }
          const ww = side < 2 ? w : d, dd = side < 2 ? d : w;
          if (x - ww / 2 < x0 + 4 || x + ww / 2 > x0 + BLK - 4 || z - dd / 2 < z0 + 4 || z + dd / 2 > z0 + BLK - 4) continue;
          if (blk.b.some((o) => Math.abs(o.x - x) < (o.w + ww) / 2 + 6 && Math.abs(o.z - z) < (o.d + dd) / 2 + 6)) continue;
          const hs = { x, z, w: ww, d: dd, h, dx, dz, col: pick(["#d9a066", "#c96f4a", "#e8d9b5", "#9fb7c9", "#b3c99a", "#d98a8a", "#cdb4db"]), n: 0, street: "", id: houses.length };
          hs.door = { x: x + dx * (ww / 2 + 22) * (dx ? 1 : 0), z: z + dz * (dd / 2 + 22) * (dz ? 1 : 0) };
          if (!dx) hs.door.x = x;
          if (!dz) hs.door.z = z;
          hs.n = 1 + Math.floor(R() * 40);
          hs.street = STREETS[(side * 3 + bx + bz * 2) % STREETS.length];
          blk.b.push(hs);
          houses.push(hs);
        }
    }
  // pizzeria: keskimmäisen korttelin talo
  const mid = blocks[Math.floor(blocks.length / 2)];
  if (!mid.b.length) { mid.park = false; }
  pizzeria = { x: mid.x0 + BLK / 2, z: mid.z0 - 22, w: 160, d: 110, h: 60 };
  mid.b = mid.b.filter((h) => !(Math.abs(h.x - pizzeria.x) < 150 && h.z < mid.z0 + 140));
  houses = blocks.flatMap((b) => b.b);
  houses.forEach((h, i) => (h.id = i));
  pizzeria.box = { x: pizzeria.x, z: mid.z0 + 70, w: 170, d: 120, h: 60 };
  // töyssyt ja tietyöt teille
  for (let i = 0; i <= N; i++)
    for (let j = 0; j < N; j++) {
      if (R() < 0.35) bumps.push({ x: roadCenter(i), z: RD + j * CELL + BLK / 2, ax: "z" });
      if (R() < 0.35) bumps.push({ x: RD + j * CELL + BLK / 2, z: roadCenter(i), ax: "x" });
      if (R() < 0.1 + lv * 0.02) cones.push({ x: roadCenter(i) + (R() - 0.5) * 50, z: RD + j * CELL + 40 + R() * (BLK - 80) });
      if (R() < 0.1 + lv * 0.02) cones.push({ x: RD + j * CELL + 40 + R() * (BLK - 80), z: roadCenter(i) + (R() - 0.5) * 50 });
    }
}
// kiinteät esteet ympyrää vasten
function solids() {
  const out = [];
  for (const h of houses) out.push(h);
  out.push(pizzeria.box);
  return out;
}
let SOLIDS = [];
function hitRect(o, r, s) {
  const cx = clamp(o.x, s.x - s.w / 2, s.x + s.w / 2), cz = clamp(o.z, s.z - s.d / 2, s.z + s.d / 2);
  let dx = o.x - cx, dz = o.z - cz;
  const d2 = dx * dx + dz * dz;
  if (d2 >= r * r) return null;
  if (d2 < 1e-6) { dx = o.x - s.x; dz = o.z - s.z; const l = Math.hypot(dx, dz) || 1; return { nx: dx / l, nz: dz / l, pen: r }; }
  const d = Math.sqrt(d2);
  return { nx: dx / d, nz: dz / d, pen: r - d };
}

// ---------- tila ----------
let M = null, G = {}, gulls = [], cars = [], flying = [];
function newOrder() {
  // kohde vähintään vähän matkan päässä
  let h;
  for (let t = 0; t < 40; t++) { h = pick(houses); if (Math.hypot(h.door.x - pizzeria.x, h.door.z - pizzeria.z) > 500) break; }
  const n = 1 + Math.floor(Math.random() * S.maxStack);
  const dist = Math.hypot(h.door.x - pizzeria.x, h.door.z - pizzeria.z);
  G.order = { house: h.id, n, time: 18 + dist / 60, max: 18 + dist / 60, worst: 0 };
}
function stepCars(dt) {
  for (const c of cars) {
    // auto ajaa korttelin ympäri myötäpäivään
    const seg = c.path[c.k], nxt = c.path[(c.k + 1) % 4];
    const dx = nxt.x - c.x, dz = nxt.z - c.z, d = Math.hypot(dx, dz);
    // jarruttaa mopon edessä
    const ahead = Math.hypot(M.x - (c.x + (dx / d) * 60), M.z - (c.z + (dz / d) * 60)) < 70;
    c.v = lerp(c.v, ahead ? 0 : c.sp, Math.min(1, 3 * dt));
    if (d < c.v * dt + 1) { c.x = nxt.x; c.z = nxt.z; c.k = (c.k + 1) % 4; }
    else { c.x += (dx / d) * c.v * dt; c.z += (dz / d) * c.v * dt; c.a = Math.atan2(dx, dz); }
  }
}
function crash(why, imp) {
  if (!G.stack) return;
  Coop.emit("crash", M.x, M.z, G.stack, why);
  for (let i = 0; i < G.stack; i++) flying.push({ x: M.x, y: 30 + i * 9, z: M.z, vx: (Math.random() - 0.5) * 300, vy: 200 + Math.random() * 200, vz: (Math.random() - 0.5) * 300, r: Math.random() * 6, life: 2.5 });
  G.stack = 0; G.tilt = 0; G.tiltV = 0; G.lost++;
  G.order = null;
}

function step(dt, inputs) {
  G.time -= dt;
  const st = inputs[0], gs = inputs[1];
  // ---- mopo ----
  const throttle = -gs.y; // ylös = kaasu
  if (throttle > 0) M.v += 300 * throttle * dt;
  else if (throttle < 0) M.v += (M.v > 10 ? -480 : -140) * -throttle * dt;
  M.v *= Math.exp(-(throttle ? 0.25 : 0.9) * dt);
  M.v = clamp(M.v, -90, 340);
  const steerPow = clamp(Math.abs(M.v) / 140, 0.2, 1) * Math.sign(M.v || 1);
  const yawRate = -st.x * 2.5 * steerPow;
  M.a += yawRate * dt;
  M.x += Math.sin(M.a) * M.v * dt;
  M.z += Math.cos(M.a) * M.v * dt;
  M.lean = lerp(M.lean, st.x * clamp(M.v / 250, 0, 1) * 0.45, Math.min(1, 8 * dt));
  // reunat
  if (M.x < 15 || M.x > SIZE - 15 || M.z < 15 || M.z > SIZE - 15) { M.x = clamp(M.x, 15, SIZE - 15); M.z = clamp(M.z, 15, SIZE - 15); M.v *= -0.3; }
  // talot
  for (const s of SOLIDS) {
    const h = hitRect(M, 16, s);
    if (!h) continue;
    M.x += h.nx * h.pen; M.z += h.nz * h.pen;
    const vn = Math.sin(M.a) * h.nx + Math.cos(M.a) * h.nz; // nopeus seinää kohti
    const imp = -vn * M.v;
    if (imp > 0) { M.v *= 0.35; if (imp > 150) crash("wall", imp); else { G.tiltV += (Math.random() - 0.5) * imp * 0.02; Coop.emit("bonk", M.x, M.z); } }
  }
  // autot
  for (const c of cars) {
    const d = Math.hypot(c.x - M.x, c.z - M.z);
    if (d < 34) {
      const nx = (M.x - c.x) / (d || 1), nz = (M.z - c.z) / (d || 1);
      M.x = c.x + nx * 34; M.z = c.z + nz * 34;
      if (Math.abs(M.v) > 60) crash("auto", 200);
      M.v *= -0.4;
      Coop.emit("honkCar", c.x, c.z);
    }
  }
  // töyssyt ja kartiot
  for (const b of bumps) {
    const along = b.ax === "z" ? Math.abs(M.z - b.z) : Math.abs(M.x - b.x);
    const across = b.ax === "z" ? Math.abs(M.x - b.x) : Math.abs(M.z - b.z);
    if (along < 8 && across < RD / 2 && Math.abs(M.v) > 40 && !(M.lastBump === b && G.t - M.bumpT < 0.5)) {
      M.lastBump = b; M.bumpT = G.t;
      const k = Math.abs(M.v) / 100;
      G.tiltV += (Math.random() < 0.5 ? -1 : 1) * k * 1.1;
      M.hop = Math.min(18, Math.abs(M.v) / 14);
      Coop.emit("bump", M.x, M.z, k);
    }
  }
  for (const c of cones) {
    if (c.hit > 0) { c.hit -= dt; continue; }
    if (Math.hypot(c.x - M.x, c.z - M.z) < 22) { c.hit = 3; M.v *= 0.6; G.tiltV += (Math.random() - 0.5) * 2.2; Coop.emit("cone", c.x, c.z); }
  }
  M.hop = Math.max(0, M.hop - 60 * dt);
  // ---- pizzapino ----
  if (G.stack > 0) {
    const n = G.stack;
    const latAcc = M.v * yawRate; // keskipakovoima
    G.tiltV += (-latAcc * 0.0011 + Math.sin(G.tilt) * (2.2 + n * 0.55) - gs.x * 3.6 - G.tiltV * 1.6) * dt;
    G.tilt += G.tiltV * dt;
    if (G.order) G.order.worst = Math.max(G.order.worst, Math.abs(G.tilt));
    if (Math.abs(G.tilt) > 0.62) crash("pino");
  } else { G.tilt *= Math.exp(-6 * dt); G.tiltV = 0; }
  // ---- töötti ----
  if (st.aP || st.bP) { G.horn = 0.5; Coop.emit("horn", M.x, M.z); for (const g of gulls) if (Math.hypot(g.x - M.x, g.z - M.z) < 260) { g.flee = 2.5; g.steal = 0; } }
  G.horn = Math.max(0, G.horn - dt);
  // ---- lokit ----
  for (const g of gulls) {
    g.t += dt;
    if (g.flee > 0) {
      g.flee -= dt;
      const dx = g.x - M.x, dz = g.z - M.z, d = Math.hypot(dx, dz) || 1;
      g.vx = lerp(g.vx, (dx / d) * 260, 3 * dt); g.vz = lerp(g.vz, (dz / d) * 260, 3 * dt); g.y = lerp(g.y, 140, 2 * dt);
    } else if (G.stack > 0 && Math.hypot(g.x - M.x, g.z - M.z) < 700) {
      // syöksyy pizzojen kimppuun
      const dx = M.x - g.x, dz = M.z - g.z, d = Math.hypot(dx, dz) || 1;
      const sp = 170 + S.gulls * 6;
      g.vx = lerp(g.vx, (dx / d) * sp + Math.sin(M.a) * M.v * 0.6, 2.2 * dt); g.vz = lerp(g.vz, (dz / d) * sp + Math.cos(M.a) * M.v * 0.6, 2.2 * dt);
      g.y = lerp(g.y, d < 120 ? 48 : 110, 2 * dt);
      if (d < 34) {
        g.steal += dt;
        if (g.steal > 0.8) {
          g.steal = 0; g.flee = 4; G.stack--; G.stolen++;
          Coop.emit("steal", M.x, M.z);
          flying.push({ x: g.x, y: 60, z: g.z, vx: g.vx, vy: 120, vz: g.vz, r: 0, life: 1.4, gull: true });
          if (G.stack <= 0) { G.order = null; Coop.emit("emptyStack"); }
        }
      } else g.steal = Math.max(0, g.steal - dt);
    } else {
      // kiertelee taivaalla
      g.vx = lerp(g.vx, Math.cos(g.t * 0.6 + g.ph) * 120, dt); g.vz = lerp(g.vz, Math.sin(g.t * 0.6 + g.ph) * 120, dt); g.y = lerp(g.y, 150, dt);
    }
    g.x = clamp(g.x + g.vx * dt, -200, SIZE + 200); g.z = clamp(g.z + g.vz * dt, -200, SIZE + 200);
  }
  stepCars(dt);
  for (const f of flying) { f.x += f.vx * dt; f.y += f.vy * dt; f.z += f.vz * dt; f.vy -= 700 * dt; if (f.y < 3) { f.y = 3; f.vy *= -0.3; f.vx *= 0.6; f.vz *= 0.6; } f.life -= dt; }
  flying = flying.filter((f) => f.life > 0);
  // ---- tilaukset ----
  const atPizzeria = Math.hypot(M.x - pizzeria.x, M.z - pizzeria.z) < 70 && Math.abs(M.v) < 90;
  if (!G.order && atPizzeria) {
    newOrder();
    G.stack = G.order.n; G.tilt = 0; G.tiltV = 0;
    Coop.emit("pickup", G.order.n, G.order.house);
  }
  if (G.order) {
    G.order.time -= dt;
    const h = houses[G.order.house];
    if (G.stack > 0 && Math.hypot(M.x - h.door.x, M.z - h.door.z) < 55 && Math.abs(M.v) < 110) {
      // toimitus: maksu + tippi nopeudesta ja pizzojen kunnosta
      const base = 6 * G.stack;
      const fast = clamp(G.order.time / G.order.max, 0, 1);
      const neat = 1 - clamp(G.order.worst / 0.62, 0, 1);
      const tip = Math.round(G.stack * (2 + 6 * fast + 6 * neat));
      const missing = G.order.n - G.stack;
      const pay = Math.max(2, base + tip - missing * 4);
      G.money += pay; G.delivered++;
      Coop.emit("deliver", h.door.x, h.door.z, pay, tip, missing);
      G.order = null; G.stack = 0;
    }
  }
  G.t += dt;
  if (G.time <= 0) {
    G.time = 0;
    const ok = G.money >= S.quota;
    Coop.end({
      ok,
      kicker: "Shift " + G.lv + " over",
      title: ok ? "Ka-ching!" : "The boss isn't happy",
      text: ok ? pick(["The gulls stayed hungry and the customers happy. More orders tomorrow.", "The moped is smoking a bit, but the quota is met."]) : pick(["Too much pizza on the asphalt and in the gulls' bellies.", "You fell short of the quota. Another try tomorrow on the same moped."]),
      stamp: ok ? "PAID" : "SHORT",
      stats: [["Earned", G.money + " €"], ["Quota", S.quota + " €"], ["Deliveries", G.delivered], ["Stacks dropped", G.lost], ["Stolen by gulls", G.stolen]],
      next: "Next shift",
    });
  }
}

// ---------- nettipeli ----------
const r1 = (v) => Math.round(v * 10) / 10, r2 = (v) => Math.round(v * 100) / 100;
function snapshot() {
  return {
    m: [r1(M.x), r1(M.z), r2(M.a), r1(M.v), r2(M.lean), r1(M.hop)],
    t: r1(G.time), $: G.money, s: G.stack, tl: r2(G.tilt), h: r2(G.horn), d: G.delivered, l: G.lost, sl: G.stolen,
    o: G.order ? [G.order.house, G.order.n, r1(G.order.time), r1(G.order.max)] : null,
    g: gulls.map((g) => [r1(g.x), r1(g.y), r1(g.z), r1(g.vx), r1(g.vz)]),
    c: cars.map((c) => [r1(c.x), r1(c.z), r2(c.a)]),
  };
}
function apply(s, first) {
  M.tx = s.m[0]; M.tz = s.m[1]; M.ta = s.m[2]; M.v = s.m[3]; M.lean = s.m[4]; M.hop = s.m[5];
  if (first) { M.x = M.tx; M.z = M.tz; M.a = M.ta; }
  G.time = s.t; G.money = s.$; G.stack = s.s; G.tilt = s.tl; G.horn = s.h; G.delivered = s.d; G.lost = s.l; G.stolen = s.sl;
  G.order = s.o ? { house: s.o[0], n: s.o[1], time: s.o[2], max: s.o[3] } : null;
  s.g.forEach((a, i) => { const g = gulls[i]; if (!g) return; g.tx = a[0]; g.ty = a[1]; g.tz = a[2]; g.vx = a[3]; g.vz = a[4]; if (first) { g.x = a[0]; g.y = a[1]; g.z = a[2]; } });
  s.c.forEach((a, i) => { const c = cars[i]; if (!c) return; c.tx = a[0]; c.tz = a[1]; c.a = a[2]; if (first) { c.x = a[0]; c.z = a[1]; } });
}

// ---------- 3D ----------
const renderer = new THREE.WebGLRenderer({ canvas: $("gl"), antialias: true });
renderer.setPixelRatio(Math.min(1.5, devicePixelRatio || 1));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
const scene = new THREE.Scene();
scene.background = new THREE.Color("#9fc6e8");
scene.fog = new THREE.Fog("#9fc6e8", 900, 2600);
