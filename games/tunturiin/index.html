<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Peak Pals</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#141826;font-family:"Segoe UI",system-ui,sans-serif;color:#f4efe6}
canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh}
#hud{position:fixed;left:0;right:0;top:12px;display:flex;justify-content:center;gap:8px;pointer-events:none;z-index:5;flex-wrap:wrap;padding:0 12px}
#hud[hidden],.pp[hidden]{display:none}
.pill{background:rgba(12,14,24,.7);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:7px 13px;display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px;backdrop-filter:blur(4px)}
.pill small{font-weight:700;color:#b9b2a6;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase}
#sunBar{width:110px;height:8px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}
#sunFill{height:100%;background:linear-gradient(90deg,#ff6a3d,#ffd36a);border-radius:9px}
#time.low{color:#ff8c6a}
.berry{width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffd08a,#f08a24 60%,#b85a10);box-shadow:0 0 0 2px rgba(0,0,0,.25)}
.pp{position:fixed;bottom:14px;pointer-events:none;z-index:5;background:rgba(12,14,24,.7);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:8px 14px;font-weight:800;font-size:14px;min-width:170px}
.pp b{display:flex;align-items:center;gap:8px}.pp b i{width:11px;height:11px;border-radius:50%}
.pp span{display:block;color:#b9b2a6;font-size:12px;font-weight:700;margin-top:3px}
#pp1{left:14px}#pp2{right:14px}
#wind{position:fixed;left:50%;top:64px;transform:translate(-50%,-6px);z-index:6;pointer-events:none;font:900 22px "Segoe UI Black","Arial Black",system-ui,sans-serif;letter-spacing:.06em;color:#dff1ff;
  text-shadow:0 2px 0 rgba(0,0,0,.5);background:rgba(20,40,70,.55);border:1px solid rgba(180,220,255,.3);border-radius:12px;padding:6px 16px;opacity:0;transition:opacity .2s,transform .2s}
#wind.on{opacity:1;transform:translate(-50%,0)}
#wind.gust{background:rgba(60,110,170,.7);color:#fff}
</style>
</head>
<body>
<canvas id="ov"></canvas>
<div id="hud" hidden>
  <div class="pill"><small id="lvName">Saana</small></div>
  <div class="pill"><small>Sunset</small><div id="sunBar"><div id="sunFill"></div></div><span id="time">4:00</span></div>
  <div class="pill"><small>Altitude</small><span id="alt">0 m</span></div>
  <div class="pill"><i class="berry"></i><span id="ber">0 / 3</span></div>
  <div class="pill"><small>Pitons</small><span id="pit">3</span></div>
</div>
<div id="wind"></div>
<div class="pp" id="pp1" hidden><b><i style="background:#ff8a3d"></i><span style="color:inherit;display:inline;margin:0" id="n1">PATE</span></b><span id="k1"></span></div>
<div class="pp" id="pp2" hidden><b><i style="background:#33d1c4"></i><span style="color:inherit;display:inline;margin:0" id="n2">MASA</span></b><span id="k2"></span></div>

<script src="../_shared/three.min.js"></script>
<script src="../_shared/peerjs.min.js"></script>
<script src="../_shared/coop.js"></script>
<script>
// Peak Pals – kiipeilyseikkailu Lapin tuntureilla. Yksinpeli tai co-op netissä.
// Kenttä on ruudukko (tile grid): kalliota, jäätä (ei pitoa), murenevaa kiveä ja railojen pohjia.
(() => {
"use strict";
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
function mulberry32(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const hash = (a, b) => { const s = Math.sin(a * 12.9898 + b * 78.233) * 43758.5453; return s - Math.floor(s); };
const pick = (a) => a[Math.floor(Math.random() * a.length)];

const T = 32;                 // ruudun koko
const PW = 10, PH = 34;       // pelaajan puolileveys ja korkeus
const GRAV = 1500, JUMP = 520, CLIMB = 100, WALK = 210;
const AIR = 0, ROCK = 1, ICE = 2, CRUM = 3, PIT = 4;
const gripT = (t) => t === ROCK || t === CRUM;
const NAMES = ["PATE", "MASA"], COLS = ["#ff8a3d", "#33d1c4"];
const FELLS = [
  { n: "Saana", m: 1029, base: 480, top: 52 },
  { n: "Pallas", m: 807, base: 330, top: 62 },
  { n: "Ylläs", m: 718, base: 260, top: 72 },
  { n: "Pyhä", m: 540, base: 180, top: 82 },
  { n: "Halti", m: 1324, base: 700, top: 94 },
  { n: "Kebnekaise", m: 2097, base: 900, top: 108 },
];
function fell(lv) {
  const i = (lv - 1) % FELLS.length, loop = Math.floor((lv - 1) / FELLS.length), b = FELLS[i];
  return { n: b.n + (loop ? " #" + (loop + 1) : ""), m: b.m, base: b.base, top: b.top + loop * 10, D: i + 1 + loop * 2, idx: i };
}

// ---------- kenttä ----------
let W = 0, TH = 0, grid = null, slick = null, saus = [], bers = [], cps = [], spawners = [], signs = [], crumList = [], crumIdx = new Map(), summit = null, F = null, windRow = Infinity, topOf = null;
function tile(cx, cy) { if (cx < 0 || cx >= W || cy < 0) return ROCK; if (cy >= TH) return AIR; return grid[cy * W + cx]; }
const solid = (cx, cy) => tile(cx, cy) !== AIR;
const solidAt = (x, y) => solid(Math.floor(x / T), Math.floor(y / T));

function buildMap(seed, lv) {
  const R = mulberry32(seed);
  F = fell(lv);
  const D = F.D, MAXW = 1800;
  TH = F.top + 32;
  const g = new Uint8Array(MAXW * TH), sl = new Uint8Array(MAXW);
  saus = []; bers = []; cps = []; spawners = []; signs = [];
  const berryCand = [];
  const ri = (a, b) => a + Math.floor(R() * (b - a + 1));
  const put = (x, y, t) => { if (x >= 0 && x < MAXW && y >= 0 && y < TH) g[y * MAXW + x] = t; };
  const col = (x, hh, t = ROCK) => { for (let y = 0; y < TH; y++) g[y * MAXW + x] = y < hh ? t : AIR; };
  const seen = new Set();
  const sign = (sx, sy, txt, type) => {
    if (seen.has(type)) return;
    const near = signs.findIndex((o) => Math.abs(o.x - (sx * T + T / 2)) < 6 * T);
    if (near >= 0) { if (signs[near].type !== "basics") return; signs.splice(near, 1); }
    seen.add(type); signs.push({ x: sx * T + T / 2, y: sy * T, t: txt, type });
  };
  const sausAt = (sx, sy) => saus.push({ x: sx * T + T / 2, y: sy * T + 12, e: false });
  const spawner = (px, py) => spawners.push({ x: px, y: py, per: 2.7 + R() * 1.6, t: R() * 2.5, warn: false, gy: 0 });
  windRow = D >= 3 ? Math.floor(F.top * 0.55) : Infinity;
  let x = 0, h = 3, est = 0;
  for (; x < 12; x++) col(x, h);
  cps.push({ x: 4 * T, y: h * T, i: 0, start: true });
  sign(8, h, "Hold SHIFT to grip|W climbs · SPACE jumps", "basics");

  function stairs() {
    const n = ri(2, 4);
    for (let k = 0; k < n; k++) {
      const r = ri(1, D >= 3 ? 4 : 3), t = ri(2, 5);
      for (let i = 0; i < t; i++) col(x + i, h + r);
      if (R() < 0.25) sausAt(x + (t >> 1), h + r);
      if (R() < 0.2) berryCand.push([x + (t >> 1), h + r + 2]);
      x += t; h += r; est += 2.5 + r * 0.3;
    }
  }
  function cliff() {
    const r = ri(5, Math.min(13, 6 + Math.round(D * 1.3))), t = ri(4, 6);
    if (r >= 8) sign(x - 3, h, "Tall wall ahead!|E hammers a piton: rest on it", "piton");
    else sign(x - 3, h, "Grip the wall with SHIFT|W/S to climb · W at the top", "cliff");
    if (r >= 9 && R() < 0.75) { const mh = h + Math.floor(r / 2); col(x, mh); if (R() < 0.5) sausAt(x, mh); x++; }
    const wx = x;
    for (let i = 0; i < t; i++) col(x + i, h + r);
    if (D >= 4 && R() < 0.35) { spawner(wx * T - 14, (h + r + 9) * T); sign(wx - 4, h, "Falling rocks!|Watch for the warning", "rocks"); }
    x += t; h += r; est += r * 0.45 + 4;
  }
  function gap() {
    // leveässä railossa on mureneva askelkivi kohdassa, johon täysi hyppy osuu
    const gw = D <= 1 ? ri(2, 3) : D >= 3 && R() < 0.45 ? 6 : ri(3, 4);
    const hb = Math.max(1, h - ri(4, 7));
    sign(x - 3, h, "Crevasse!|Run and jump with SPACE", "gap");
    for (let i = 0; i < gw; i++) { col(x + i, hb); put(x + i, hb - 1, PIT); }
    if (gw === 6) put(x + 4, h - 1, CRUM);
    if (R() < 0.4) berryCand.push([x + Math.floor(gw / 2), h + 2]);
    x += gw;
    const hl = h + (D >= 3 && R() < 0.4 ? 1 : 0), t = ri(3, 5);
    for (let i = 0; i < t; i++) col(x + i, hl);
    x += t; h = hl; est += 5;
  }
  function crumbleRun() {
    const n = ri(3, 3 + Math.min(3, D - 1)), w = n * 2 + 1, hb = Math.max(1, h - ri(4, 6));
    sign(x - 3, h, "Crumbling rock!|Don't stop moving", "crum");
    for (let i = 0; i < w; i++) { col(x + i, hb); put(x + i, hb - 1, PIT); }
    for (let k = 0; k < n; k++) {
      const sy = h - 1 + (k % 2 && D >= 3 ? 1 : 0);
      put(x + 1 + k * 2, sy, CRUM);
      if (k === (n >> 1) && R() < 0.5) berryCand.push([x + 1 + k * 2, sy + 4]);
    }
    x += w;
    const t = ri(3, 5);
    for (let i = 0; i < t; i++) col(x + i, h);
    x += t; est += 4 + n;
  }
  function chimney() {
    const r = ri(6, Math.min(12, 7 + D)), wd = D >= 4 && R() < 0.5 ? 4 : 3;
    sign(x - 3, h, "Ice can't be gripped!|Jump between the walls with SPACE", "chim");
    col(x, h);
    for (let y = h + 3; y < h + r + 3; y++) put(x, y, ICE);
    for (let i = 1; i <= wd; i++) col(x + i, h);
    const rx = x + wd + 1, t = ri(4, 6);
    for (let i = 0; i < t; i++) col(rx + i, h + r);
    for (let y = h; y < h + r - 1; y++) put(rx, y, ICE);
    if (R() < 0.45) berryCand.push([x + 1 + (wd >> 1), h + r + 1]);
    x = rx + t; h += r; est += 12 + r * 0.7;
  }
  function iceBand() {
    const r = ri(9, 12), band = D >= 5 ? 3 : 2, t = ri(4, 6);
    sign(x - 3, h, "Icy band!|W + SPACE while gripping = lunge", "band");
    for (let i = 0; i < t; i++) col(x + i, h + r);
    for (let y = h + 4; y < h + 4 + band; y++) put(x, y, ICE);
    x += t; h += r; est += r * 0.5 + 7;
  }
  function gully() {
    sign(x - 3, h, "Falling rocks!|Watch for the warning", "rocks");
    const n = ri(3, 4), steps = [];
    for (let k = 0; k < n; k++) {
      const r = ri(1, 2), t = ri(3, 4);
      for (let i = 0; i < t; i++) col(x + i, h + r);
      steps.push(x + (t >> 1));
      x += t; h += r;
    }
    for (const sx of steps) spawner(sx * T + T / 2, (h + 11) * T);
    est += 10;
  }
  function ridge() {
    sign(x - 3, h, "Wind gusts up here!|Grip the rock when it blows", "wind");
    const n = ri(2, 3);
    for (let k = 0; k < n; k++) {
      const t = ri(3, 5);
      for (let i = 0; i < t; i++) { col(x + i, h); if (D >= 4 && R() < 0.5) sl[x + i] = 1; }
      x += t;
      const hb = Math.max(1, h - 5);
      for (let i = 0; i < 2; i++) { col(x + i, hb); put(x + i, hb - 1, PIT); }
      x += 2;
    }
    for (let i = 0; i < 3; i++) col(x + i, h);
    x += 3; est += 8;
  }
  function hut() {
    sign(x + 1, h, "Hut = checkpoint|Refills stamina · +1 piton", "hut");
    for (let i = 0; i < 8; i++) col(x + i, h);
    cps.push({ x: (x + 4) * T, y: h * T, i: cps.length });
    sausAt(x + 6, h);
    x += 8; est += 3;
  }
  const RUN = { stairs, cliff, gap, crum: crumbleRun, chim: chimney, band: iceBand, gully, ridge };
  const pool = () => {
    const a = [["stairs", 3], ["cliff", 4], ["gap", 3]];
    if (D >= 2) a.push(["crum", 2], ["chim", 2.5]);
    if (D >= 3) a.push(["band", 2], ["gully", 1.5]);
    if (h > windRow) a.push(["ridge", 2.5]);
    return a;
  };
  const intro = lv === 1 ? ["stairs", "gap", "cliff", "stairs", "cliff"] : lv === 2 ? ["chim"] : lv === 3 ? ["band"] : [];
  let last = "", secN = 0;
  while (h < F.top - 3 && x < MAXW - 80) {
    let type;
    if (intro.length) type = intro.shift();
    else {
      const a = pool().filter((e) => e[0] !== last);
      let s = a.reduce((q, e) => q + e[1], 0) * R();
      type = a[a.length - 1][0];
      for (const e of a) { s -= e[1]; if (s <= 0) { type = e[0]; break; } }
    }
    RUN[type]();
    last = type; secN++;
    if (secN % 3 === 0 && h < F.top - 8) hut();
  }
  // huippu
  const sx0 = x;
  for (let i = 0; i < 14; i++) col(x + i, h);
  summit = { x0: sx0 * T, x1: (sx0 + 14) * T, y: h * T, gx: (sx0 + 7) * T };
  x += 14;
  while (h > 3) { h = Math.max(3, h - ri(1, 3)); col(x, h); col(x + 1, h); x += 2; }
  for (let i = 0; i < 10; i++) col(x + i, 3);
  x += 10;
  W = x;
  grid = new Uint8Array(W * TH); slick = new Uint8Array(W);
  for (let y = 0; y < TH; y++) for (let cx = 0; cx < W; cx++) grid[y * W + cx] = g[y * MAXW + cx];
  for (let cx = 0; cx < W; cx++) slick[cx] = sl[cx];
  topOf = new Int16Array(W);
  for (let cx = 0; cx < W; cx++) { let t = 0; for (let y = 0; y < TH; y++) if (grid[y * W + cx] !== AIR) t = y + 1; topOf[cx] = t; }
  // murenevat kivet
  crumList = []; crumIdx = new Map();
  for (let y = 0; y < TH; y++) for (let cx = 0; cx < W; cx++) if (grid[y * W + cx] === CRUM) { crumIdx.set(y * W + cx, crumList.length); crumList.push({ cx, cy: y, idx: y * W + cx, st: 0, t: 0 }); }
  // putoavien kivien osumakohta
  for (const s of spawners) { const cx = Math.floor(s.x / T); let cy = Math.min(TH - 1, Math.floor(s.y / T)); while (cy > 0 && !solid(cx, cy)) cy--; s.gy = (cy + 1) * T; }
  // lakat: kolme eri puolilta reittiä
  berryCand.sort((a, b) => a[0] - b[0]);
  while (berryCand.length < 3) { const cx = 20 + Math.floor(R() * (sx0 - 30)); berryCand.push([cx, topOf[cx] + 2]); berryCand.sort((a, b) => a[0] - b[0]); }
  const used = new Set();
  for (const f of [0.18, 0.55, 0.88]) {
    let k = Math.min(berryCand.length - 1, Math.floor(f * berryCand.length));
    while (used.has(k)) k = (k + 1) % berryCand.length;
    used.add(k);
    const [bx, by] = berryCand[k];
    bers.push({ x: bx * T + T / 2, y: by * T + 12, got: false });
  }
  F.time = Math.round(est * (2.2 - 0.1 * Math.min(6, D)) + 40);
}

// ---------- pelaajat ----------
function mkP(i) {
  return { i, x: 0, y: 0, vx: 0, vy: 0, ground: true, cling: 0, st: 100, tired: false, face: 1, stun: 0, fallTop: 0, coyote: 0, rescue: 0, climbing: false, hang: false, falls: 0,
    kickLock: 0, kickCd: 0, kickSide: 0, lunge: false, autoGrip: 0, resting: false, slide: false };
}
let P = [], G = {};
const NOIN = { x: 0, y: 0, a: false, b: false, c: false, aP: false, bP: false, cP: false };

function boxHit(x, y) {
  const x0 = Math.floor((x - PW) / T), x1 = Math.floor((x + PW - 0.01) / T);
  const y0 = Math.floor(y / T), y1 = Math.floor((y + PH - 0.01) / T);
  for (let cx = x0; cx <= x1; cx++) for (let cy = y0; cy <= y1; cy++) if (solid(cx, cy)) return true;
  return false;
}
function moveP(p, dt) {
  const along = (dx, dy) => {
    const n = Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)) / 6);
    for (let i = 0; i < n; i++) {
      const sx = dx / n, sy = dy / n;
      if (!boxHit(p.x + sx, p.y + sy)) { p.x += sx; p.y += sy; continue; }
      const m = Math.ceil(Math.max(Math.abs(sx), Math.abs(sy)));
      for (let j = 0; j < m; j++) {
        const ux = sx / m, uy = sy / m;
        if (boxHit(p.x + ux, p.y + uy)) return true;
        p.x += ux; p.y += uy;
      }
      return true;
    }
    return false;
  };
  if (along(p.vx * dt, 0)) p.vx = 0;
  p.ground = false;
  if (along(0, p.vy * dt)) { if (p.vy < 0) p.ground = true; p.vy = 0; }
  if (!p.ground && p.vy <= 0 && boxHit(p.x, p.y - 1)) p.ground = true;
}
function wallInfo(p, side, dy = 0) {
  const cx = Math.floor((p.x + side * (PW + 2)) / T), y = p.y + dy;
  const rl = Math.floor((y + 4) / T), rm = Math.floor((y + PH / 2) / T), ru = Math.floor((y + PH - 4) / T);
  const tl = tile(cx, rl), tm = tile(cx, rm), tu = tile(cx, ru);
  return { cx, any: !!(tl || tm || tu), grip: gripT(tl) || gripT(tm) || gripT(tu), up: !!(tu || tm), low: !!tl, below: solid(cx, Math.floor((y - 6) / T)), rows: [rl, rm, ru] };
}
const anchored = (p) => p.cling !== 0 || p.ground;
function tileUnder(p) {
  const cy = Math.floor((p.y - 1) / T);
  for (const ox of [0, -PW + 1, PW - 1]) { const t = tile(Math.floor((p.x + ox) / T), cy); if (t !== AIR) return t; }
  return AIR;
}

// ---------- pelilogiikka (yksinpeli / isäntä) ----------
function step(dt, inputs) {
  G.time -= dt;
  G.t += dt;
  const grips = P.map((p) => inputs[p.i].a || p.autoGrip > 0);
  if (P.length === 2) {
    const [A, B] = P;
    const d = Math.hypot(B.x - A.x, B.y - A.y);
    const both = grips[0] && grips[1] && A.stun <= 0 && B.stun <= 0 && A.rescue <= 0 && B.rescue <= 0;
    if (!G.link) {
      const reach = inputs[0].aP || inputs[1].aP;
      if (both && reach && d < 52 && !(A.cling && B.cling)) { G.link = true; G.linkLen = Math.max(30, d); Coop.emit("link", (A.x + B.x) / 2, (A.y + B.y) / 2 + PH); }
    } else if (!both || d > 110) { G.link = false; if (d > 110) Coop.emit("snap", B.x, B.y); }
  }
  for (const p of P) playerStep(p, inputs[p.i], grips[p.i], dt);
  if (P.length === 2 && G.link) linkConstraint(inputs, dt);
  crumbleStep(dt);
  rocksStep(dt);
  windStep(dt);
  // makkarat ja lakat
  for (const s of saus) {
    if (s.e) continue;
    const p = P.find((p) => p.rescue <= 0 && Math.abs(p.x - s.x) < 22 && Math.abs(p.y + PH / 2 - s.y) < 30);
    if (p) { s.e = true; G.saus++; p.st = Math.min(100, p.st + 45); Coop.emit("eat", p.i, s.x, s.y); }
  }
  for (const b of bers) {
    if (b.got) continue;
    const p = P.find((p) => p.rescue <= 0 && Math.abs(p.x - b.x) < 22 && Math.abs(p.y + PH / 2 - b.y) < 30);
    if (p) { b.got = true; G.ber++; Coop.emit("berry", p.i, b.x, b.y, G.ber); }
  }
  // kodat
  for (const cp of cps) {
    if (cp.i <= G.cp) continue;
    if (P.some((p) => p.rescue <= 0 && Math.abs(p.x - cp.x) < 70 && Math.abs(p.y - cp.y) < 40)) {
      G.cp = cp.i; G.pitLeft = Math.min(5, G.pitLeft + 1); G.resp = { x: cp.x, y: cp.y, cl: 0 };
      for (const p of P) { p.st = 100; p.tired = false; }
      Coop.emit("cp", cp.i, cp.x, cp.y);
      G.wantSave = true;
    }
  }
  // huippu
  const atTop = (p) => p.x > summit.x0 && p.x < summit.x1 && p.y >= summit.y - 2 && p.rescue <= 0;
  if (P.every(atTop)) { G.topT += dt; if (G.topT > 1.2) return finish(true); } else G.topT = 0;
  if (G.time <= 0) { G.time = 0; return finish(false); }
  if (G.wantSave) { G.wantSave = false; Coop.save(); }
}

function playerStep(p, inp, grip, dt) {
  const o = P.length === 2 ? P[1 - p.i] : null;
  if (p.rescue > 0) { p.rescue -= dt; if (p.rescue <= 0) respawn(p); return; }

const pv = new THREE.Vector3();
function project(x, y, z = 10) { pv.set(x, y, z).project(camera); return [(pv.x + 1) / 2 * vw, (1 - pv.y) / 2 * vh, pv.z]; }
function drawOverlay(phase, tt) {

    og.strokeStyle = "rgba(255,90,74,.5)"; og.setLineDash([6, 6]); og.lineWidth = 2; og.beginPath(); og.moveTo(x, y - 40); og.lineTo(x, y - 260); og.stroke(); og.setLineDash([]);

let hudKey = "";

const localHigh = () => P.some((p) => Coop.localPlayers.includes(p.i) && p.y / T > windRow - 4);

// ---------- efektit ----------
function text(x, y, m, c = "#fff", s = 18, life = 1.2) { texts.push({ x, y, m, c, s, life, t: 0 }); }
function burst(x, y, c, n = 10, sp = 160, r) { for (let i = 0; i < n; i++) { const a = Math.random() * 6.283, v = sp * (0.3 + Math.random()); fx.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v + 100, c, t: 0, life: 0.6 + Math.random() * 0.5, r }); } }
const T_ = Coop.tone;
function onEvent(name, a) {
  switch (name) {
    case "jump": T_(330, 0.12, "triangle", 0.06, 520); break;
    case "kick": T_(420, 0.1, "triangle", 0.07, 700); burst(a[1], a[2], "#e8f4ff", 6, 90, 2); break;
    case "lunge": T_(300, 0.2, "triangle", 0.07, 900); text(a[1], a[2], "LUNGE!", "#7ec8ff", 16, 0.8); break;
    case "mantle": T_(260, 0.12, "triangle", 0.06, 420); break;
    case "land": burst(a[0], a[1], "rgba(220,214,200,.8)", 5, 70, 2); break;
    case "eat": T_(880, 0.08, "square", 0.05); T_(1180, 0.12, "square", 0.05, null, 0.08); text(a[1], a[2], "YUM! +stamina", "#ffd36a", 16); burst(a[1], a[2], "#b5523b", 8, 120); break;
    case "berry": [784, 988, 1318].forEach((f, i) => T_(f, 0.14, "triangle", 0.07, null, i * 0.07)); text(a[1], a[2], "CLOUDBERRY " + a[3] + "/3!", "#ffb347", 20, 1.6); burst(a[1], a[2], "#f39a2e", 14, 170, 3); break;
    case "slip": T_(500, 0.35, "sawtooth", 0.06, 180); text(a[1], a[2], "SLIPPED!", "#ff8c6a", 20); break;
    case "thud": Coop.noise(0.35, 0.25, 300); T_(90, 0.25, "sine", 0.12, 50); shake = Math.max(shake, a[3]); text(a[1], a[2], pick(["THUD!", "OUCH!", "OOPS!"]), "#fff", 22); burst(a[1], a[2] + 4, "#d8d2c4", 12, 140); break;
    case "rescue": Coop.noise(0.3, 0.3, 500); text(a[1], a[2], a[3] === "pit" ? "Into the crevasse!" : "Long way down!", "#ff8c6a", 20, 1.4); text(a[1], a[2] - 30, "The reindeer is on its way…", "#e9dcc0", 15, 1.6); break;
    case "respawn": Coop.toast(NAMES[a[0]] + (a[1] ? " BACK ON THE PITON" : " BACK AT THE HUT") + "<small>The reindeer handled it. −8 seconds</small>", 1800, true); T_(200, 0.3, "sawtooth", 0.05, 120); break;
    case "piton": [1800, 1500, 1800].forEach((f, i) => T_(f, 0.05, "square", 0.05, null, i * 0.09)); burst(a[0], a[1], "#c9ccd1", 6, 80, 2); text(a[0], a[1] - 40, "PITON IN!", "#c9ccd1", 15, 0.9); break;
