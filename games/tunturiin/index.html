<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chained Climbers</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#141826;font-family:"Segoe UI",system-ui,sans-serif;color:#f4efe6}
canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh}
#hud{position:fixed;left:0;right:0;top:12px;display:flex;justify-content:center;gap:8px;pointer-events:none;z-index:5;flex-wrap:wrap;padding:0 12px}
#hud[hidden],.pp[hidden]{display:none}
.pill{background:rgba(12,14,24,.72);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:7px 13px;display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px;backdrop-filter:blur(4px)}
.pill small{font-weight:700;color:#b9b2a6;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase}
#altBar{width:90px;height:8px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}
#altFill{height:100%;background:linear-gradient(90deg,#7ec8ff,#ffffff);border-radius:9px}
#stormPill.near{border-color:rgba(255,120,90,.8);background:rgba(70,20,30,.8)}
#stormPill.near #storm{color:#ffb09a}
.berry{width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffd08a,#f08a24 60%,#b85a10);box-shadow:0 0 0 2px rgba(0,0,0,.25)}
.pp{position:fixed;bottom:14px;pointer-events:none;z-index:5;background:rgba(12,14,24,.72);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:8px 14px;font-weight:800;font-size:14px;min-width:170px;max-width:46vw}
.pp b{display:flex;align-items:center;gap:8px}.pp b i{width:11px;height:11px;border-radius:50%}
.pp span{display:block;color:#b9b2a6;font-size:12px;font-weight:700;margin-top:3px}
#pp1{left:14px}#pp2{right:14px}
#wind{position:fixed;left:50%;top:64px;transform:translate(-50%,-6px);z-index:6;pointer-events:none;font:900 22px "Segoe UI Black","Arial Black",system-ui,sans-serif;letter-spacing:.06em;color:#dff1ff;
  text-shadow:0 2px 0 rgba(0,0,0,.5);background:rgba(20,40,70,.55);border:1px solid rgba(180,220,255,.3);border-radius:12px;padding:6px 16px;opacity:0;transition:opacity .2s,transform .2s}
#wind.on{opacity:1;transform:translate(-50%,0)}
#wind.gust{background:rgba(60,110,170,.7);color:#fff}
#frost{position:fixed;inset:0;pointer-events:none;z-index:4;opacity:0;transition:opacity .25s;
  background:radial-gradient(ellipse at center,rgba(200,230,255,0) 45%,rgba(200,230,255,.55) 80%,rgba(235,248,255,.9) 100%)}
#flash{position:fixed;inset:0;pointer-events:none;z-index:4;background:#e9f2ff;opacity:0}
/* saavutukset */
.achbtn{display:inline-flex!important;align-items:center;gap:8px}
.achbtn svg{width:22px;height:22px}
#achv{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(8,10,18,.7);backdrop-filter:blur(3px);padding:16px}
#achv[hidden]{display:none}
#achv .card{width:min(880px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;gap:12px;background:#1a1d2b;border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.achhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.achhead h2{margin:2px 0 0;font-size:26px}
.achhead .kick{color:#ffb347;font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.achpct{display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:220px}
.achpct .big{font-size:38px;font-weight:900;line-height:.9}
.achpct small{color:#b9b2a6;font-weight:700}
.achbar{width:100%;height:10px;background:rgba(255,255,255,.1);border-radius:9px;overflow:hidden}
.achbar i{display:block;height:100%;background:linear-gradient(90deg,#c98a1a,#ffd36a);width:0;transition:width .4s}
.achfilter{display:flex;gap:8px;flex-wrap:wrap}
.achfilter button{font:700 14px "Segoe UI",system-ui,sans-serif;color:#f4efe6;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:7px 14px;cursor:pointer}
.achfilter button[aria-pressed="true"]{background:#ffb347;color:#2a1405;border-color:#ffb347}
.achgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;overflow:auto;padding:2px 4px 2px 0;min-height:120px}
.ach{display:flex;gap:11px;align-items:flex-start;padding:10px 11px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:12px}
.ach.done{background:rgba(255,211,106,.1);border-color:rgba(255,211,106,.45)}
.ach svg{width:46px;height:46px;flex:none}
.ach div{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.ach b{font-size:15px}
.ach span{font-size:13px;color:#d8d2c6;line-height:1.3}
.ach:not(.done) b,.ach:not(.done) span{opacity:.6}
.ach small{font-size:12px;font-weight:700;color:#b9b2a6}
.ach .pb{height:5px;background:rgba(255,255,255,.1);border-radius:9px;margin-top:4px;overflow:hidden}
.ach .pb i{display:block;height:100%;background:#ffb347}
.achempty{padding:18px 4px;font-weight:700;color:#b9b2a6}
.achfoot{display:flex;justify-content:flex-end}
.achfoot button{font:800 15px "Segoe UI",system-ui,sans-serif;background:#ffb347;color:#2a1405;border:0;border-radius:12px;padding:10px 20px;cursor:pointer}
#achPops{position:fixed;right:14px;top:70px;display:flex;flex-direction:column;gap:10px;z-index:70;pointer-events:none}
.achpop{display:flex;gap:12px;align-items:center;width:min(340px,80vw);background:#1a1d2b;color:#f4efe6;padding:10px 14px 10px 10px;box-shadow:0 8px 24px rgba(0,0,0,.5);border:1px solid rgba(255,211,106,.6);border-radius:14px;animation:achIn .45s cubic-bezier(.2,1.4,.4,1) both}
.achpop.out{animation:achOut .35s ease-in both}
@keyframes achIn{from{transform:translateX(120%)}to{transform:translateX(0)}}
@keyframes achOut{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(60%)}}
.achpop svg{width:54px;height:54px;flex:none;filter:drop-shadow(0 0 10px rgba(255,211,106,.7))}
.achpop div{display:flex;flex-direction:column;gap:1px;min-width:0}
.achpop em{font-style:normal;font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#ffb347}
.achpop b{font-size:17px}
.achpop span{font-size:13px;color:#d8d2c6;line-height:1.25}
</style>
</head>
<body>
<canvas id="ov"></canvas>
<div id="frost"></div>
<div id="flash"></div>
<div id="hud" hidden>
  <div class="pill"><small id="lvName">Saana</small><span id="zone">Foothills</span></div>
  <div class="pill"><small>Altitude</small><div id="altBar"><div id="altFill"></div></div><span id="alt">0 m</span></div>
  <div class="pill" id="stormPill"><small>Storm</small><span id="storm">waiting</span></div>
  <div class="pill"><i class="berry"></i><span id="ber">0 / 3</span></div>
  <div class="pill"><small>Pitons</small><span id="pit">3</span></div>
  <div class="pill"><small>Time</small><span id="time">0:00</span></div>
</div>
<div id="wind"></div>
<div class="pp" id="pp1" hidden><b><i style="background:#ff8a3d"></i><span style="color:inherit;display:inline;margin:0" id="n1">PATE</span></b><span id="k1"></span></div>
<div class="pp" id="pp2" hidden><b><i style="background:#33d1c4"></i><span style="color:inherit;display:inline;margin:0" id="n2">MASA</span></b><span id="k2"></span></div>
<div id="achPops" aria-live="polite"></div>
<div id="achv" hidden role="dialog" aria-modal="true" aria-labelledby="achTitle">
  <div class="card">
    <div class="achhead">
      <div><div class="kick">Chained Climbers</div><h2 id="achTitle">Achievements</h2></div>
      <div class="achpct"><span class="big" id="achPct">0 %</span><small id="achCount"></small><div class="achbar"><i id="achBar"></i></div></div>
    </div>
    <div class="achfilter" role="group" aria-label="Filter">
      <button data-af="all" aria-pressed="true">All</button><button data-af="done" aria-pressed="false">Unlocked</button><button data-af="todo" aria-pressed="false">Locked</button>
    </div>
    <div class="achgrid" id="achGrid"></div>
    <div class="achfoot"><button id="achClose">Close</button></div>
  </div>
</div>
<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="ccGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2a8"/><stop offset=".45" stop-color="#ffcf3f"/><stop offset="1" stop-color="#c98a1a"/></linearGradient>
  <linearGradient id="ccSilver" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#cfd6de"/><stop offset="1" stop-color="#8a96a3"/></linearGradient>
  <linearGradient id="ccBronze" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd2a8"/><stop offset=".5" stop-color="#d08a4a"/><stop offset="1" stop-color="#8a5228"/></linearGradient>
</defs></svg>

<script src="../_shared/three.min.js"></script>
<script src="../_shared/peerjs.min.js"></script>
<script src="../_shared/coop.js"></script>
<script src="core.js"></script>
<script>
// Chained Climbers – kaksi kiipeilijää kahlittuna yhteen. Yksinpelissä kaverina botti, co-op netissä.
// Pelilogiikka on tiedostossa core.js (kenttä, fysiikka, ketju, myrsky, botti). Tässä grafiikka, äänet ja valikot.
(() => {
"use strict";
const $ = (id) => document.getElementById(id);
const { T, PW, PH, W, AIR, ROCK, ICE, CRUM, PLAT, SLAB, Z, ZNAME, CHAIN, clamp, mulberry32 } = CC;
const MAP = CC.M, S = CC.S;
const lerp = (a, b, t) => a + (b - a) * t;
const hash = (a, b) => { const s = Math.sin(a * 12.9898 + b * 78.233) * 43758.5453; return s - Math.floor(s); };
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const NAMES = ["PATE", "MASA"], COLS = ["#ff8a3d", "#33d1c4"];
const isBotGame = () => S.P[1] && S.P[1].bot;
let P = [], G = null;
const sync = () => { P = S.P; G = S.G; };
const MT = () => MAP.MT;
const meters = (y) => Math.round(MT().base + (MT().m - MT().base) * clamp(y / MAP.summit.y, 0, 1));
const mPerPx = () => (MT().m - MT().base) / MAP.summit.y;
const mmss = (s) => Math.floor(s / 60) + ":" + String(Math.floor(Math.max(0, s) % 60)).padStart(2, "0");

// ---------- grafiikka ----------
let Q = true;
try { Q = (localStorage.getItem("climbers:gfx") || localStorage.getItem("tunturiin:gfx") || "quality") === "quality"; } catch {}
let renderer = null, glc = null;
const ov = $("ov"), og = ov.getContext("2d");
let vw = 0, vh = 0, odpr = 1;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, 1, 10, 16000);
function makeRenderer() {
  if (renderer) { renderer.dispose(); try { renderer.forceContextLoss(); } catch {} glc.remove(); }
  glc = document.createElement("canvas");
  document.body.insertBefore(glc, ov);
  renderer = new THREE.WebGLRenderer({ canvas: glc, antialias: Q, powerPreference: Q ? "high-performance" : "default" });
  renderer.setPixelRatio(Q ? Math.min(2, devicePixelRatio || 1) : Math.min(1, devicePixelRatio || 1));
  renderer.shadowMap.enabled = Q;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  resize();
}
function resize() {
  vw = innerWidth; vh = innerHeight; odpr = Math.min(2, devicePixelRatio || 1);
  if (renderer) renderer.setSize(vw, vh, false);
  camera.aspect = vw / vh; camera.updateProjectionMatrix();
  ov.width = vw * odpr; ov.height = vh * odpr;
}
addEventListener("resize", resize);

const hemi = new THREE.HemisphereLight("#cfe0ff", "#40362a", 0.8);
const sun = new THREE.DirectionalLight("#ffe2b8", 1.15);
sun.shadow.mapSize.set(2048, 2048);
{ const sc = sun.shadow.camera; sc.left = -900; sc.right = 900; sc.top = 800; sc.bottom = -800; sc.near = 10; sc.far = 4500; }
sun.shadow.bias = -0.0006;
const rim = new THREE.DirectionalLight("#9fb8ff", 0.3);
const fireLight = new THREE.PointLight("#ff9a4a", 0, 520, 2);
const lampLights = [0, 1, 2].map(() => new THREE.PointLight("#ffb25a", 0, 420, 2));
const headLights = [0, 1].map(() => new THREE.PointLight("#fff1d0", 0, 360, 2));
scene.add(hemi, sun, sun.target, rim, fireLight, ...lampLights, ...headLights);
scene.fog = new THREE.Fog("#a9c8e6", 900, 6500);

let MATS = {};
function MM(o) {
  const k = (Q ? "q" : "p") + JSON.stringify(o, (key, v) => (v && v.isTexture ? v.uuid : v));
  if (MATS[k]) return MATS[k];
  let m;
  if (Q) m = new THREE.MeshStandardMaterial(Object.assign({ roughness: 0.85 }, o));
  else {
    const p = {};
    for (const key of ["color", "map", "emissive", "emissiveIntensity", "side", "transparent", "opacity", "vertexColors"]) if (o[key] !== undefined) p[key] = o[key];
    m = new THREE.MeshLambertMaterial(p);
  }
  return (MATS[k] = m);
}
const mat = (c, o) => MM(Object.assign({ color: c }, o || {}));
function add(g, geo, m, x, y, z) { const me = new THREE.Mesh(geo, m); me.position.set(x || 0, y || 0, z || 0); me.castShadow = Q; me.receiveShadow = Q; g.add(me); return me; }
const BOX = new THREE.BoxGeometry(1, 1, 1);
const SPH = new THREE.SphereGeometry(1, 12, 9);
const DOD = new THREE.DodecahedronGeometry(1, 0);
function canvasTex(w, h, draw, rep) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding;
  if (rep) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 4;
  return t;
}
const DOT = canvasTex(64, 64, (g) => { const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, "rgba(255,255,255,1)"); gr.addColorStop(0.45, "rgba(255,255,255,.8)"); gr.addColorStop(1, "rgba(255,255,255,0)"); g.fillStyle = gr; g.fillRect(0, 0, 64, 64); });
const TEX = {
  rock: canvasTex(128, 128, (g, w, h) => {
    g.fillStyle = "#d8d8d8"; g.fillRect(0, 0, w, h);
    const R = mulberry32(5);
    for (let i = 0; i < 900; i++) { const v = 150 + R() * 105; g.fillStyle = `rgb(${v},${v},${v})`; g.fillRect(R() * w, R() * h, 1 + R() * 3, 1 + R() * 3); }
    g.strokeStyle = "rgba(60,60,60,.35)"; g.lineWidth = 1.5;
    for (let i = 0; i < 6; i++) { g.beginPath(); let x = R() * w, y = R() * h; g.moveTo(x, y); for (let k = 0; k < 5; k++) { x += (R() - 0.5) * 40; y += R() * 26; g.lineTo(x, y); } g.stroke(); }
  }, true),
  slab: canvasTex(128, 128, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, w, h); gr.addColorStop(0, "#cfcfcf"); gr.addColorStop(1, "#b5b5b5"); g.fillStyle = gr; g.fillRect(0, 0, w, h);
    const R = mulberry32(17);
    g.strokeStyle = "rgba(255,255,255,.25)"; g.lineWidth = 2;
    for (let i = 0; i < 5; i++) { g.beginPath(); const y = R() * h; g.moveTo(0, y); g.bezierCurveTo(w * 0.3, y + 10, w * 0.7, y - 12, w, y + 4); g.stroke(); }
    for (let i = 0; i < 300; i++) { const v = 170 + R() * 60; g.fillStyle = `rgba(${v},${v},${v},.5)`; g.fillRect(R() * w, R() * h, 1, 1); }
  }, true),
  crack: canvasTex(64, 64, (g, w, h) => {
    g.fillStyle = "#d9c3aa"; g.fillRect(0, 0, w, h);
    const R = mulberry32(9);
    for (let i = 0; i < 260; i++) { g.fillStyle = `rgba(90,60,30,${R() * 0.3})`; g.fillRect(R() * w, R() * h, 1 + R() * 2, 1 + R() * 2); }
    g.strokeStyle = "rgba(50,28,12,.85)"; g.lineWidth = 1.4;
    for (let i = 0; i < 4; i++) { g.beginPath(); let x = R() * w, y = 0; g.moveTo(x, y); while (y < h) { x += (R() - 0.5) * 18; y += 6 + R() * 8; g.lineTo(x, y); } g.stroke(); }
  }),
  ice: canvasTex(64, 128, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, w, h); gr.addColorStop(0, "#f4fbff"); gr.addColorStop(1, "#bfe0f7"); g.fillStyle = gr; g.fillRect(0, 0, w, h);
    g.strokeStyle = "rgba(255,255,255,.85)"; g.lineWidth = 2;
    for (let i = 0; i < 7; i++) { const x = (i / 7) * w + 4; g.beginPath(); g.moveTo(x, 0); g.lineTo(x + 18, h); g.stroke(); }
    g.strokeStyle = "rgba(120,170,210,.35)"; g.lineWidth = 1;
    for (let i = 0; i < 10; i++) { g.beginPath(); g.moveTo(0, i * 13); g.lineTo(w, i * 13 + 6); g.stroke(); }
  }),
  wall: canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = "#c8c8c8"; g.fillRect(0, 0, w, h);
    const R = mulberry32(23);
    for (let i = 0; i < 260; i++) { const x = R() * w, y = R() * h, r = 6 + R() * 26, v = 150 + R() * 90; const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, `rgba(${v},${v},${v},.55)`); gr.addColorStop(1, `rgba(${v},${v},${v},0)`); g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2); }
    for (let i = 0; i < 2500; i++) { const v = 120 + R() * 120; g.fillStyle = `rgba(${v},${v},${v},.35)`; g.fillRect(R() * w, R() * h, 1, 1); }
    g.strokeStyle = "rgba(55,55,55,.4)"; g.lineWidth = 1.2;
    for (let i = 0; i < 9; i++) { g.beginPath(); let x = R() * w, y = R() * h; g.moveTo(x, y); for (let k = 0; k < 7; k++) { x += (R() - 0.5) * 30; y += 8 + R() * 22; g.lineTo(x, y); } g.stroke(); }
  }, true),
  wood: canvasTex(64, 32, (g, w, h) => {
    g.fillStyle = "#8a6038"; g.fillRect(0, 0, w, h);
    g.strokeStyle = "rgba(40,22,8,.6)"; g.lineWidth = 2;
    for (let x = 0; x <= w; x += 16) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); }
    g.strokeStyle = "rgba(255,220,170,.18)"; g.lineWidth = 1;
    for (let y = 4; y < h; y += 7) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y + 2); g.stroke(); }
  }),
  cloud: canvasTex(256, 128, (g, w, h) => {
    const R = mulberry32(31);
    for (let i = 0; i < 40; i++) { const x = 20 + R() * (w - 40), y = 30 + R() * (h - 50), r = 14 + R() * 30; const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, "rgba(255,255,255,.55)"); gr.addColorStop(1, "rgba(255,255,255,0)"); g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); }
  }),
};

// taivas
const skyU = { top: { value: new THREE.Color() }, mid: { value: new THREE.Color() }, bot: { value: new THREE.Color() }, sunDir: { value: new THREE.Vector3(0.3, 0.5, -1) }, sunCol: { value: new THREE.Color() } };
const sky = new THREE.Mesh(new THREE.SphereGeometry(13000, 32, 16), new THREE.ShaderMaterial({
  uniforms: skyU, side: THREE.BackSide, depthWrite: false, fog: false,
  vertexShader: "varying vec3 vW; void main(){ vW = (modelMatrix*vec4(position,1.0)).xyz - cameraPosition; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }",
  fragmentShader: "uniform vec3 top; uniform vec3 mid; uniform vec3 bot; uniform vec3 sunDir; uniform vec3 sunCol; varying vec3 vW;" +
    "void main(){ vec3 d = normalize(vW); float h = d.y; vec3 c = h > 0.0 ? mix(mid, top, pow(clamp(h*1.4,0.0,1.0), 0.55)) : mix(mid, bot, clamp(-h*4.0,0.0,1.0));" +
    "float s = max(dot(d, normalize(sunDir)), 0.0); c += sunCol * (pow(s, 900.0) * 2.0 + pow(s, 12.0) * 0.35 + pow(s, 3.0) * 0.08);" +
    "gl_FragColor = linearToOutputTexel(vec4(c, 1.0)); }",
}));
sky.frustumCulled = false; sky.renderOrder = -10;
scene.add(sky);
const stars = (() => {
  const N = 700, pos = new Float32Array(N * 3), R = mulberry32(77);
  for (let i = 0; i < N; i++) { const a = R() * Math.PI * 2, e = 0.08 + R() * 1.3, r = 12000; pos[i * 3] = Math.cos(a) * Math.cos(e) * r; pos[i * 3 + 1] = Math.sin(e) * r; pos[i * 3 + 2] = Math.sin(a) * Math.cos(e) * r; }
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  const p = new THREE.Points(g, new THREE.PointsMaterial({ color: "#ffffff", size: 2.2, sizeAttenuation: false, transparent: true, opacity: 0, depthWrite: false, fog: false }));
  p.frustumCulled = false; p.renderOrder = -9;
  scene.add(p); return p;

  u.rig.rotation.z = p.stun > 0 ? Math.sin(tt * 20) * 0.18 : p.hang ? Math.sin(tt * 3 + p.i) * 0.12 : 0;
  u.legs[0].rotation.x = walk * 0.8; u.legs[1].rotation.x = -walk * 0.8;

  else if (p.brace) { u.legs[0].rotation.x = 0.5; u.legs[1].rotation.x = -0.4; }
  else if (!p.ground) { u.legs[0].rotation.x = -0.5; u.legs[1].rotation.x = 0.3; }
  u.arms.forEach((a, k) => {

    else if (p.hang) a.rotation.set(-3 + Math.sin(tt * 6 + k) * 0.2, 0, (k ? -1 : 1) * 0.3);
    else if (p.brace) a.rotation.set(-1.2, 0, (k ? -1 : 1) * 0.2);
    else if (p.slide) a.rotation.set(-2.2, 0, (k ? -1 : 1) * 0.3);

    "Falling drags your partner. Hold <b>Shift</b> to catch them. Dangling: <b>A/D</b> swings, <b>W</b> climbs the chain, <b>Space</b> leaps.",
    "A storm rises from below. Reach the next hut before it catches you, find 3 cloudberries and light the grill at the summit.",
    "Singleplayer: Masa the bot climbs with you, holds the chain and shows the way if you get stuck.",
  ],
  netVersion: "climbers-1",
  names: ["Pate", "Masa"],
  colors: COLS,
  labels: { move: "WASD", a: "Shift = grip", b: "Space = jump" },
  help: [
    "<kbd>A</kbd><kbd>D</kbd> walk · <kbd>W</kbd><kbd>S</kbd> climb · <kbd>Space</kbd> jump · <kbd>Shift</kbd> grip / hold chain · <kbd>E</kbd> piton",
    "",
  ],
  keys: [{ left: ["KeyA", "ArrowLeft"], right: ["KeyD", "ArrowRight"], up: ["KeyW", "ArrowUp"], down: ["KeyS", "ArrowDown"], a: ["ShiftLeft", "ShiftRight"], b: ["Space"], c: ["KeyE"] }],
  pad: { a: [4, 5, 6, 7], b: [0], c: [2, 3] },
  levelName: (lv) => CC.mountain(lv).n,
  describeSave: (s) => {
    const m = CC.mountain(s.level);
    return m.n + " (mountain " + s.level + ")" + (s.data && s.data.v === 2 && s.data.cp ? " · hut " + s.data.cp : "");
  },
  settings: [{ label: "Graphics", options: [["quality", "High quality"], ["performance", "High performance"]], get: () => (Q ? "quality" : "performance"), set: setGfx }],
  footer: "Esc = pause · M = sound · G = switch graphics · gamepads work too",
  theme: { accent: "#ffb347", accentInk: "#2a1405", card: "#1a1d2b", bg: "rgba(16,18,30,.72)" },
  game: {
    init, step, snapshot, apply, render, onEvent, preview, saveData,
    onMenu: () => { showHud(false); preview(); },
    save: () => true,
  },
});
// saavutusnappi päävalikkoon ja taukovalikkoon
for (const id of ["coMenu", "coPause"]) {
  const row = document.querySelector("#" + id + " .co-row");
  if (!row) continue;
  const b = document.createElement("button");
  b.className = "co-btn ghost achbtn"; b.type = "button";
  b.onclick = () => openAch(b);
  row.appendChild(b);
}
achLabel();
})();
</script>
