<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Peak Pals</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#141826;font-family:"Segoe UI",system-ui,sans-serif;color:#f4efe6}
canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh}
#hud{position:fixed;left:0;right:0;top:12px;display:flex;justify-content:center;gap:10px;pointer-events:none;z-index:5}
#hud[hidden]{display:none}
.pill{background:rgba(12,14,24,.72);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:8px 14px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;backdrop-filter:blur(4px)}
.pill small{font-weight:700;color:#b9b2a6;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
#sunBar{width:120px;height:8px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}
#sunFill{height:100%;background:linear-gradient(90deg,#ff6a3d,#ffd36a);border-radius:9px}
#time.low{color:#ff8c6a}
#alt{min-width:118px}
.pp{position:fixed;bottom:14px;pointer-events:none;z-index:5;background:rgba(12,14,24,.72);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:8px 14px;font-weight:800;font-size:14px;min-width:170px}
.pp b{display:flex;align-items:center;gap:8px}.pp b i{width:11px;height:11px;border-radius:50%}
.pp span{display:block;color:#b9b2a6;font-size:12px;font-weight:700;margin-top:3px}
#pp1{left:14px}#pp2{right:14px}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="ov"></canvas>
<div id="hud" hidden>
  <div class="pill"><small id="lvName">Saana</small></div>
  <div class="pill"><small>Sunset</small><div id="sunBar"><div id="sunFill"></div></div><span id="time">4:00</span></div>
  <div class="pill"><small>Altitude</small><span id="alt">0 m</span></div>
  <div class="pill"><small>Sausages</small><span id="saus">0</span></div>
</div>
<div class="pp" id="pp1" hidden><b><i style="background:#ff8a3d"></i><span style="color:inherit;display:inline;margin:0" id="n1">PATE</span></b><span id="k1"></span></div>
<div class="pp" id="pp2" hidden><b><i style="background:#33d1c4"></i><span style="color:inherit;display:inline;margin:0" id="n2">MASA</span></b><span id="k2"></span></div>

<script src="../_shared/three.min.js"></script>
<script src="../_shared/peerjs.min.js"></script>
<script src="../_shared/coop.js"></script>
<script>
// Tunturiin! – kiivetkää kaksin tunturin huipulle ennen auringonlaskua ja paistakaa makkarat.
(() => {
"use strict";
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
function mulberry32(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

const T = 32;                 // ruudun koko
const PW = 10, PH = 34;       // pelaajan puolileveys ja korkeus
const GRAV = 1500, JUMP = 520, CLIMB = 95, WALK = 200;
const NAMES = ["PATE", "MASA"], COLS = ["#ff8a3d", "#33d1c4"];
const FELLS = [
  { n: "Saana", m: 1029, base: 480, top: 58, time: 240 },
  { n: "Pallas Fell", m: 807, base: 400, top: 80, time: 300 },
  { n: "Halti", m: 1324, base: 700, top: 104, time: 360 },
];
function fell(lv) {
  const b = FELLS[(lv - 1) % 3], loop = Math.floor((lv - 1) / 3);
  return { n: b.n + (loop ? " #" + (loop + 1) : ""), m: b.m, base: b.base, top: b.top + loop * 16, time: b.time + loop * 30, maxR: Math.min(11, 6 + lv) };
}

// ---------- maailma ----------
let W = 0, hgt = null, notch = new Set(), icy = null, saus = [], cps = [], summit = null, F = null;
const nk = (cx, cy) => cx * 4096 + cy;
function solid(cx, cy) { if (cx < 0 || cx >= W) return true; if (cy < 0) return true; return cy < hgt[cx] || notch.has(nk(cx, cy)); }
const solidAt = (x, y) => solid(Math.floor(x / T), Math.floor(y / T));

function buildMap(seed, lv) {
  const R = mulberry32(seed);
  F = fell(lv);
  const H = new Array(1500).fill(0), ice = new Array(1500).fill(0);
  notch = new Set(); saus = []; cps = [];
  let x = 0, h = 3;
  for (; x < 14; x++) H[x] = 3;
  let steps = 0;
  while (h < F.top - 4) {
    const upper = h > F.top * 0.62;
    // kuilu: tasanteella railo, johon voi pudota
    if (steps > 2 && R() < 0.14) {
      const w = 2 + Math.floor(R() * 2);
      for (let i = 0; i < w; i++) H[x + i] = Math.max(1, h - 5);
      x += w;
      for (let i = 0; i < 2; i++) H[x + i] = h;
      x += 2;
    }
    const early = steps < 3;
    const r = early ? 2 + Math.floor(R() * 3) : 2 + Math.floor(R() * (F.maxR - 1));
    // korkeassa seinämässä on puolivälissä kapea askelma lepäämistä varten
    if (r >= 7) {
      const mid = h + Math.floor(r / 2);
      H[x] = mid;
      if (R() < 0.5) saus.push({ x: x * T + T / 2, y: mid * T + 10, e: false });
      x += 1;
    }
    const t = 3 + Math.floor(R() * 6);
    for (let i = 0; i < t; i++) { H[x + i] = h + r; if (upper && R() < 0.5) ice[x + i] = 1; }
    // makkara tasanteelle
    if (R() < 0.55) saus.push({ x: (x + Math.floor(t / 2)) * T + T / 2, y: (h + r) * T + 10, e: false });
    steps++;
    if (steps % 5 === 0 && t >= 4) cps.push({ x: (x + 1) * T + T, y: (h + r) * T, i: cps.length });
    x += t;
    h += r;
  }
  // huippu
  const sx = x;
  for (let i = 0; i < 12; i++) H[x + i] = h;
  summit = { x0: sx * T, x1: (sx + 12) * T, y: h * T, gx: (sx + 6) * T };
  x += 12;
  // toinen rinne alas
  while (h > 3) { h = Math.max(3, h - 1 - Math.floor(R() * 3)); for (let i = 0; i < 2; i++) H[x + i] = h; x += 2; }
  for (let i = 0; i < 10; i++) H[x + i] = 3;
  x += 10;
  W = x;
  hgt = new Int16Array(W); icy = new Uint8Array(W);
  for (let i = 0; i < W; i++) { hgt[i] = H[i]; icy[i] = ice[i]; }
}

// ---------- pelaajat ----------
function mkP(i) {
  return { i, x: (4 + i * 3) * T, y: 3 * T, vx: 0, vy: 0, ground: true, cling: 0, st: 100, tired: false, face: 1, stun: 0, fallTop: 3 * T, coyote: 0, rescue: 0, climbing: false, hang: false, falls: 0 };
}
let P = [], G = {};

function boxHit(x, y) {
  // törmääkö pelaajan laatikko (x = keskikohta, y = jalat)
  const x0 = Math.floor((x - PW) / T), x1 = Math.floor((x + PW - 0.01) / T);
  const y0 = Math.floor(y / T), y1 = Math.floor((y + PH - 0.01) / T);
  for (let cx = x0; cx <= x1; cx++) for (let cy = y0; cy <= y1; cy++) if (solid(cx, cy)) return true;
  return false;
}
function moveP(p, dt) {
  // liike pienin askelin; törmätessä edetään yksikkö kerrallaan seinään asti
  const along = (dx, dy) => {
    const n = Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)) / 6);
    for (let i = 0; i < n; i++) {
      const sx = dx / n, sy = dy / n;
      if (!boxHit(p.x + sx, p.y + sy)) { p.x += sx; p.y += sy; continue; }
      const m = Math.ceil(Math.max(Math.abs(sx), Math.abs(sy)));
      for (let j = 0; j < m; j++) {
        const ux = sx / m, uy = sy / m;
        if (boxHit(p.x + ux, p.y + uy)) return true;
        p.x += ux; p.y += uy;
      }
      return true;
    }
    return false;
  };
  if (along(p.vx * dt, 0)) p.vx = 0;
  p.ground = false;
  if (along(0, p.vy * dt)) { if (p.vy < 0) p.ground = true; p.vy = 0; }
  if (!p.ground && p.vy <= 0 && boxHit(p.x, p.y - 1)) p.ground = true;
}
// seinä vieressä? palauttaa {up, low} kummallekin puolelle
function wallInfo(p, side) {
  const cx = Math.floor((p.x + side * (PW + 2)) / T);
  const low = solid(cx, Math.floor((p.y + 4) / T));
  const mid = solid(cx, Math.floor((p.y + PH / 2) / T));
  const up = solid(cx, Math.floor((p.y + PH - 4) / T));
  const below = solid(cx, Math.floor((p.y - 6) / T)); // tasanteen reuna jalkojen alla
  return { any: low || mid || up, up: up || mid, low, below };
}
const anchored = (p) => p.cling !== 0 || p.ground;

// ---------- pelilogiikka (isäntä) ----------
function step(dt, inputs) {
  G.time -= dt;
  G.t += dt;
  const [A, B] = P;
  // kädestä kiinni: molemmat pitävät tarttumisnäppäintä ja ovat lähekkäin
  const d = Math.hypot(B.x - A.x, (B.y + PH / 2) - (A.y + PH / 2));
  const bothGrab = inputs[0].a && inputs[1].a && A.stun <= 0 && B.stun <= 0 && A.rescue <= 0 && B.rescue <= 0;
  if (!G.link) {
    // tarttuminen kädestä vaatii uuden painalluksen, eikä molemmat saa roikkua seinässä
    const reach = inputs[0].aP || inputs[1].aP;
    if (bothGrab && reach && d < 52 && !(A.cling && B.cling)) { G.link = true; G.linkLen = Math.max(30, d); Coop.emit("link", (A.x + B.x) / 2, (A.y + B.y) / 2 + PH); }
  } else if (!bothGrab || d > 110) { G.link = false; if (d > 110) Coop.emit("snap", B.x, B.y); }

  for (const p of P) {
    let inp = inputs[p.i];
    const o = P[1 - p.i];
    if (p.rescue > 0) {
      p.rescue -= dt;
      if (p.rescue <= 0) {
        const cp = cps[G.cp];
        p.x = cp.x + (p.i ? 20 : -20); p.y = cp.y; p.vx = p.vy = 0; p.fallTop = p.y; p.st = 100;
        Coop.emit("poro", p.i, p.x, p.y);
      }
      continue;
    }
    if (p.stun > 0) { p.stun -= dt; inp = { x: 0, y: 0, a: false, b: false, aP: false, bP: false }; }
    if (inp.x) p.face = Math.sign(inp.x);

    // tarttuminen seinään
    const sides = inp.x ? [Math.sign(inp.x), -Math.sign(inp.x)] : [p.face, -p.face];
    let wall = 0, wi = null;
    for (const s of sides) { const w = wallInfo(p, s); if (w.any) { wall = s; wi = w; break; } }
    const wasCling = p.cling;
    // lipsahtamisen jälkeen pitää ensin levätä hetki (kestävyys 35)
    if (p.tired && p.st >= 35) p.tired = false;
    if (inp.a && wall && !p.tired && p.st > 0 && (!p.ground || inp.y < 0)) p.cling = wall; else p.cling = 0;
    // seinän yläreuna: noustaan tasanteelle
    if (wasCling && inp.a && inp.y < 0) {
      const w = wallInfo(p, wasCling);
      if (!w.up && (w.low || w.below)) { p.cling = 0; p.vy = 330; p.vx = wasCling * 170; Coop.emit("mantle", p.i); }
    }
    p.climbing = false;
    const hanging = G.link && !anchored(p) && anchored(o);
    p.hang = hanging;

    if (p.cling) {
      const up = -inp.y;
      p.vy = up * CLIMB;
      p.vx = 0;
      p.climbing = up !== 0;
      let drain = 6 + (up > 0 ? 17 : up < 0 ? 6 : 0);
      if (G.link && !anchored(o)) drain += 14; // kaveri roikkuu kädestä
      p.st -= drain * dt;
      if (p.st <= 0) { p.st = 0; p.cling = 0; p.tired = true; Coop.emit("slip", p.i, p.x, p.y + PH); }
      if (inp.bP && p.st > 8) {
        const s = p.cling;
        p.cling = 0; p.vy = 470; p.vx = -s * 230; p.st -= 10;
        Coop.emit("jump", p.i);
      }
    } else {
      const ice = p.ground && icy[Math.floor(p.x / T)];
      const target = inp.x * WALK;
      const acc = p.ground ? (ice ? 2.5 : 12) : 4;
      p.vx += (target - p.vx) * Math.min(1, acc * dt);
      p.vy = Math.max(p.vy - GRAV * dt, -900);
      p.coyote = p.ground ? 0.1 : Math.max(0, p.coyote - dt);
      if (inp.bP) {
        if (hanging) {
          // heitto: kaveri heittää roikkujan ylös
          G.link = false; p.vy = 640; p.vx = (o.x - p.x) * 2; o.st = Math.max(0, o.st - 18);
          Coop.emit("toss", p.i, p.x, p.y + PH);
        } else if (p.ground || p.coyote > 0) { p.vy = JUMP; p.coyote = 0; Coop.emit("jump", p.i); }
      }
      if (p.ground) p.st = Math.min(100, p.st + 32 * dt);
    }
    // lyhyt hyppy, jos nappi päästetään irti
    if (!inp.b && p.vy > 200 && !p.cling && !hanging) p.vy -= 1400 * dt;

    const wasGround = p.ground;
    moveP(p, dt);
    // putoaminen: korkealta tömähdys
    if (p.ground || p.cling) {
      const fell = p.fallTop - p.y;
      if (!wasGround && p.ground && fell > 8 * T) {
        p.stun = 1.1; p.falls++; G.falls++;
        Coop.emit("thud", p.i, p.x, p.y, Math.min(14, fell / 40));
        // poro hakee takaisin kodalle, jos putosi selvästi sen alapuolelle
        const cp = cps[G.cp];
        if (G.cp >= 0 && cp && p.y < cp.y - 6 * T) { p.rescue = 1.6; G.time -= 10; Coop.emit("poroCall", p.i, p.x, p.y); }
      }
      p.fallTop = p.y;
    } else p.fallTop = Math.max(p.fallTop, p.y);
    if (p.ground && Math.abs(p.vx) < 1) p.fallTop = p.y;
  }

  // kädestä kiinni: rajoitetaan etäisyyttä
  if (G.link) {
    const pull = P.some((p) => p.hang && inputs[p.i].y < 0);
    G.linkLen = pull ? Math.max(26, G.linkLen - 70 * dt) : Math.min(50, G.linkLen + 20 * dt);
    const ax = A.x, ay = A.y + PH / 2, bx = B.x, by = B.y + PH / 2;
    const dd = Math.hypot(bx - ax, by - ay);
    if (dd > G.linkLen) {
      const nx = (bx - ax) / dd, ny = (by - ay) / dd, over = dd - G.linkLen;
      let wa = 0.5, wb = 0.5;
      if (anchored(A) && !anchored(B)) { wa = 0; wb = 1; }
      else if (anchored(B) && !anchored(A)) { wa = 1; wb = 0; }
      else if (anchored(A) && anchored(B)) { wa = wb = 0; }
      const tryMove = (p, mx, my) => { if (!boxHit(p.x + mx, p.y + my)) { p.x += mx; p.y += my; } else if (!boxHit(p.x, p.y + my)) p.y += my; };
      if (wa) tryMove(A, nx * over * wa, ny * over * wa);
      if (wb) tryMove(B, -nx * over * wb, -ny * over * wb);
      const rel = (B.vx - A.vx) * nx + (B.vy - A.vy) * ny;
      if (rel > 0) { A.vx += nx * rel * wa; A.vy += ny * rel * wa; B.vx -= nx * rel * wb; B.vy -= ny * rel * wb; }
    }
  }

  // makkarat
  for (const s of saus) {
    if (s.e) continue;
    for (const p of P) {
      if (Math.abs(p.x - s.x) < 22 && Math.abs(p.y + PH / 2 - s.y) < 30) {
        s.e = true; G.saus++; p.st = Math.min(100, p.st + 50);
        Coop.emit("eat", p.i, s.x, s.y);
        break;
      }
    }
  }
  // kodat (välietapit)
  for (const cp of cps) {
    if (cp.i <= G.cp) continue;
    const near = (p) => Math.abs(p.x - cp.x) < 90 && Math.abs(p.y - cp.y) < 40 && p.rescue <= 0;
    if (P.every(near)) { G.cp = cp.i; Coop.emit("cp", cp.i, cp.x, cp.y); }
  }
  // huippu
  const atTop = (p) => p.x > summit.x0 && p.x < summit.x1 && p.y >= summit.y - 2 && p.rescue <= 0;
  if (P.every(atTop)) {
    G.topT += dt;
    if (G.topT > 1.6) return finish(true);
  } else G.topT = 0;
  if (G.time <= 0) { G.time = 0; return finish(false); }
}

function finish(ok) {
  const f = F, used = f.time - G.time;
  const mm = (s) => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
  Coop.end({
    ok,
    kicker: f.n + " · " + f.m + " m",
    title: ok ? "Summit! Fire up the grill." : "The sun went down",
    text: ok ? pick(["The sausages are sizzling and the view looks like a postcard. Next up: higher.", "The summit wind nearly blows the grill out, but the sausages cook anyway.", "A reindeer watches enviously. Great climbing!"])
      : pick(["No climbing in the dark. The trip starts over tomorrow.", "The headlamps were left in the car. You climbed down safely."]),
    stamp: ok ? "SUMMIT" : "TOO DARK",
    stats: [["Time used", mm(used)], ["Sausages eaten", G.saus + " / " + saus.length], ["Huts", (G.cp + 1) + " / " + cps.length], ["Falls", G.falls]],
    next: "Next fell",
    retry: "Try again",
  });
}
const pick = (a) => a[Math.floor(Math.random() * a.length)];

// ---------- nettipeli: tilannekuva ----------
const r1 = (v) => Math.round(v * 10) / 10;
function snapshot() {
  return {
    t: r1(G.time), cp: G.cp, l: G.link ? 1 : 0, ll: r1(G.linkLen), sa: G.saus, f: G.falls,
    e: saus.map((s) => (s.e ? 1 : 0)).join(""),
    P: P.map((p) => [r1(p.x), r1(p.y), r1(p.vx), r1(p.vy), Math.round(p.st), p.cling, p.face, r1(p.stun), r1(p.rescue), p.ground ? 1 : 0, p.climbing ? 1 : 0, p.hang ? 1 : 0, p.tired ? 1 : 0]),
  };
}
function apply(s, first) {
  G.time = s.t; G.cp = s.cp; G.link = !!s.l; G.linkLen = s.ll; G.saus = s.sa; G.falls = s.f;
  for (let i = 0; i < saus.length; i++) saus[i].e = s.e[i] === "1";
  s.P.forEach((a, i) => {
    const p = P[i];
    p.tx = a[0]; p.ty = a[1]; p.vx = a[2]; p.vy = a[3]; p.st = a[4]; p.cling = a[5]; p.face = a[6]; p.stun = a[7]; p.rescue = a[8]; p.ground = !!a[9]; p.climbing = !!a[10]; p.hang = !!a[11]; p.tired = !!a[12];
    if (first) { p.x = a[0]; p.y = a[1]; }
  });
}

// ---------- 3D ----------
const glc = $("gl");
const renderer = new THREE.WebGLRenderer({ canvas: glc, antialias: true });
renderer.setPixelRatio(Math.min(1.5, devicePixelRatio || 1));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, 1, 10, 9000);
const hemi = new THREE.HemisphereLight("#bcd4ff", "#3b3022", 0.75);
scene.add(hemi);
const sun = new THREE.DirectionalLight("#ffd6a0", 1.1);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
const sc = sun.shadow.camera; sc.left = -900; sc.right = 900; sc.top = 700; sc.bottom = -700; sc.near = 10; sc.far = 4000;
scene.add(sun, sun.target);
scene.fog = new THREE.Fog("#8fb0d8", 1400, 4200);
const ov = $("ov"), og = ov.getContext("2d");
let vw = 0, vh = 0, odpr = 1;
function resize() {
  vw = innerWidth; vh = innerHeight; odpr = Math.min(2, devicePixelRatio || 1);
  renderer.setSize(vw, vh, false); camera.aspect = vw / vh; camera.updateProjectionMatrix();
  ov.width = vw * odpr; ov.height = vh * odpr;
}
addEventListener("resize", resize);
resize();

const MATS = {};
const mat = (c, o) => { const k = c + JSON.stringify(o || {}); return MATS[k] || (MATS[k] = new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.85 }, o || {}))); };
function add(g, geo, m, x, y, z) { const me = new THREE.Mesh(geo, m); me.position.set(x || 0, y || 0, z || 0); me.castShadow = true; me.receiveShadow = true; g.add(me); return me; }
const BOX = new THREE.BoxGeometry(1, 1, 1);

let world = null, sausMeshes = [], cpMeshes = [], players3 = [], linkMesh = null, fire = null, snow = null;
function buildWorld() {
  if (world) { scene.remove(world); world.traverse((o) => { if (o.geometry && o.geometry !== BOX) o.geometry.dispose(); }); }
  world = new THREE.Group();
  scene.add(world);
  const tmp = new THREE.Object3D(), col = new THREE.Color();
  const topY = F.top * T;
  // pylväät (jokainen sarake yhtenä laatikkona) + pintakerros
  const front = new THREE.InstancedMesh(BOX, new THREE.MeshStandardMaterial({ roughness: 0.95, flatShading: true }), W * 2 + notch.size);
  let k = 0;
  for (let x = 0; x < W; x++) {
    const h = hgt[x] * T;
    const rel = hgt[x] / F.top;
    tmp.position.set(x * T + T / 2, h / 2, 0); tmp.scale.set(T + 0.5, h, 90); tmp.rotation.set(0, 0, 0); tmp.updateMatrix();
    front.setMatrixAt(k, tmp.matrix);
    const n = (Math.sin(x * 12.9898) * 43758.5453) % 1;
