<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cabin Rush</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#1d2a1f;font-family:"Segoe UI",system-ui,sans-serif;color:#fffaf0}
canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh}
#hud{position:fixed;left:0;right:0;top:12px;display:flex;justify-content:center;gap:10px;pointer-events:none;z-index:5}
#hud[hidden],#tasks[hidden],.pp[hidden]{display:none}
.pill{background:rgba(18,26,20,.74);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:8px 14px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px}
.pill small{font-weight:700;color:#cfe0c8;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
#time.low{color:#ff8c6a}
#tasks{position:fixed;right:14px;top:70px;background:rgba(18,26,20,.78);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px 14px;pointer-events:none;z-index:5;min-width:220px}
#tasks h4{margin:0 0 6px;font-size:12px;letter-spacing:.1em;color:#cfe0c8}
#tasks div{display:flex;justify-content:space-between;gap:12px;font-weight:800;font-size:14px;padding:3px 0}
#tasks div.done{color:#7ee081}
#tasks div.done::after{content:" ✓"}
.pp{position:fixed;bottom:14px;pointer-events:none;z-index:5;background:rgba(18,26,20,.74);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:8px 14px;font-weight:800;font-size:14px;max-width:290px}
.pp b{display:flex;align-items:center;gap:8px}.pp b i{width:11px;height:11px;border-radius:50%}
.pp span{display:block;color:#cfe0c8;font-size:12px;font-weight:700;margin-top:3px}
#pp1{left:14px}#pp2{right:14px}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="ov"></canvas>
<div id="hud" hidden>
  <div class="pill"><small id="lvName">Cabin 1</small></div>
  <div class="pill"><small>Guests arrive in</small><span id="time">5:00</span></div>
</div>
<div id="tasks" hidden><h4>TO-DO LIST</h4><div id="tPaint"></div><div id="tPlank"></div><div id="tSauna"></div><div id="tWasp"></div></div>
<div class="pp" id="pp1" hidden><b><i style="background:#ff8a3d"></i>PATE</b><span id="k1"></span><span id="h1"></span></div>
<div class="pp" id="pp2" hidden><b><i style="background:#33d1c4"></i>MASA</b><span id="k2"></span><span id="h2"></span></div>

<script src="../_shared/three.min.js"></script>
<script src="../_shared/peerjs.min.js"></script>
<script src="../_shared/coop.js"></script>
<script>
// Mökkiremontti – pomo lähti, juhannusvieraat tulevat. Maalatkaa, kantakaa, lämmittäkää ja häätäkää ampiaiset.
(() => {
"use strict";
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const pick = (a) => a[Math.floor(Math.random() * a.length)];
function mulberry32(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

const COLS = ["#ff8a3d", "#33d1c4"], NAMES = ["PATE", "MASA"];
const YW = 1500, YH = 1000;             // piha
const PR = 16, SPEED = 210;
// paikat pihalla
const COT = { x: 640, z: 430, w: 380, d: 230, h: 90 };           // mökki
const SAUNA = { x: 1230, z: 300, w: 170, d: 140, h: 70 };        // sauna rannassa
const BUCKET = { x: 420, z: 700 };                                 // maalipurkki
const WOOD = { x: 160, z: 260 };                                   // halkopino
const PUMP = { x: 1340, z: 650 };                                  // vesiletkun kela
const LUMBER = { x: 200, z: 860 };                                 // lankkupino tien vieressä
const TERRACE = { x: 640, z: 640, w: 300, d: 110 };               // terassi mökin edessä
const SDOOR = { x: SAUNA.x - SAUNA.w / 2 - 30, z: SAUNA.z + 30 };  // saunan ovi
function level(lv) { return { time: Math.max(210, 330 - (lv - 1) * 25), planks: Math.min(6, 3 + Math.floor(lv / 2)), logs: Math.min(8, 4 + Math.floor(lv / 2)), wasps: Math.min(8, 3 + lv), nest: 6 + lv * 2, segs: 10 }; }

let L = null, P = [], items = [], planks = [], segs = [], wasps = [], G = {};
const SOLIDS = [COT, SAUNA, { x: TERRACE.x, z: TERRACE.z, w: 0, d: 0 }];

function buildSegments() {
  // mökin seinät paloiksi: etu, taka, sivut
  segs = [];
  const { x, z, w, d } = COT;
  const n = 3;
  for (let i = 0; i < n; i++) {
    const sx = x - w / 2 + (i + 0.5) * (w / n);
    segs.push({ x: sx, z: z + d / 2 + 4, nx: 0, nz: 1, len: w / n, p: 0 });
    segs.push({ x: sx, z: z - d / 2 - 4, nx: 0, nz: -1, len: w / n, p: 0 });
  }
  for (let i = 0; i < 2; i++) {
    const sz = z - d / 2 + (i + 0.5) * (d / 2);
    segs.push({ x: x - w / 2 - 4, z: sz, nx: -1, nz: 0, len: d / 2, p: 0 });
    segs.push({ x: x + w / 2 + 4, z: sz, nx: 1, nz: 0, len: d / 2, p: 0 });
  }
}
function mkP(i) { return { i, x: 560 + i * 80, z: 880, vx: 0, vz: 0, fx: 0, fz: -1, hold: null, stun: 0, paint: 0, act: 0 }; }

// ---------- törmäykset ----------
function pushOut(o, r, s) {
  const cx = clamp(o.x, s.x - s.w / 2, s.x + s.w / 2), cz = clamp(o.z, s.z - s.d / 2, s.z + s.d / 2);
  let dx = o.x - cx, dz = o.z - cz;
  const d2 = dx * dx + dz * dz;
  if (d2 >= r * r || (s.w === 0 && s.d === 0)) return;
  if (d2 < 1e-6) { dx = o.x - s.x || 1; dz = o.z - s.z; }
  const d = Math.hypot(dx, dz) || 1;
  const pen = r - Math.sqrt(d2);
  o.x += (dx / d) * pen; o.z += (dz / d) * pen;
}
const near = (p, q, r) => Math.hypot(p.x - q.x, p.z - q.z) < r;

// ---------- esineet ----------
// tyypit: brush (sivellin), log (halko), hose (letku)
function grab(p) {
  // lähin vapaa esine
  let best = null, bd = 50;
  for (const it of items) { if (it.holder != null || it.placed) continue; const d = Math.hypot(it.x - p.x, it.z - p.z); if (d < bd) { bd = d; best = it; } }
  if (best) { p.hold = { t: "item", id: best.id }; best.holder = p.i; Coop.emit("grab", p.x, p.z); return; }
  // lankku: tartu päähän
  let bp = null, bpd = 46, end = 0;
  for (const pl of planks) {
    if (pl.placed) continue;
    for (const e of [-1, 1]) {
      const ex = pl.x + Math.cos(pl.a) * pl.len / 2 * e, ez = pl.z + Math.sin(pl.a) * pl.len / 2 * e;
      const d = Math.hypot(ex - p.x, ez - p.z);
      if (d < bpd && pl.holders[e > 0 ? 1 : 0] == null) { bpd = d; bp = pl; end = e; }
    }
  }
  if (bp) { bp.holders[end > 0 ? 1 : 0] = p.i; p.hold = { t: "plank", id: bp.id, end }; Coop.emit("grab", p.x, p.z); if (bp.holders.filter((h) => h != null).length < 2) Coop.emit("say", bp.x, bp.z, "Needs 2 carriers!", "#efe0b0"); else Coop.emit("say", bp.x, bp.z, "LIFT!", "#7ee081"); return; }
  // halkopino antaa uuden halon
  if (near(p, WOOD, 80) && G.logsIn + items.filter((i) => i.t === "log" && !i.placed).length < L.logs) {
    const it = { id: G.nid++, t: "log", x: p.x, z: p.z, holder: p.i };
    items.push(it); p.hold = { t: "item", id: it.id }; Coop.emit("grab", p.x, p.z); return;
  }
}
function drop(p) {
  if (!p.hold) return;
  if (p.hold.t === "item") {
    const it = items.find((i) => i.id === p.hold.id);
    if (it) {
      it.holder = null;
      if (it.t === "log" && near(it, SDOOR, 70) && !G.saunaLit) {
        it.placed = true; G.logsIn++;
        Coop.emit("logIn", SDOOR.x, SDOOR.z, G.logsIn);
      }
    }
  } else {
    const pl = planks.find((q) => q.id === p.hold.id);
    if (pl) pl.holders[p.hold.end > 0 ? 1 : 0] = null;
  }
  p.hold = null;
}
const heldItem = (p) => p.hold && p.hold.t === "item" ? items.find((i) => i.id === p.hold.id) : null;

// ---------- askel ----------
function step(dt, inputs) {
  G.time -= dt;
  G.t += dt;
  for (const p of P) {
    let inp = inputs[p.i];
    if (p.stun > 0) { p.stun -= dt; inp = { x: 0, y: 0, a: inp.a, b: false, aP: false, bP: false }; } // pistetty: jähmettyy hetkeksi, mutta pitää esineen
    const l = Math.hypot(inp.x, inp.y);
    let ix = inp.x, iz = inp.y;
    if (l > 1) { ix /= l; iz /= l; }
    if (l > 0.15) { p.fx = ix / (l > 1 ? 1 : l || 1); p.fz = iz / (l > 1 ? 1 : l || 1); }
    const carrying = p.hold && p.hold.t === "plank";
    const sp = SPEED * (carrying ? 0.72 : heldItem(p) && heldItem(p).t === "log" ? 0.85 : 1);
    p.vx = lerp(p.vx, ix * sp, Math.min(1, 12 * dt)); p.vz = lerp(p.vz, iz * sp, Math.min(1, 12 * dt));
    // tartu (pidä pohjassa)
    if (inp.a && !p.hold && inp.aP) grab(p);
    if (!inp.a && p.hold) { drop(p); Coop.emit("drop", p.x, p.z); }
    // käytä työkalua (pidä pohjassa)
    p.act = 0;
    const it = heldItem(p);
    if (inp.b && it) {
      if (it.t === "brush") {
        if (near(p, BUCKET, 70)) { it.paint = Math.min(1, (it.paint || 0) + dt * 0.8); p.act = 2; }
        else if ((it.paint || 0) > 0) {
          // lähin maalaamaton seinänpala edessä
          let best = null, bd = 70;
          for (const s of segs) { if (s.p >= 1) continue; const d = Math.hypot(s.x - p.x, s.z - p.z); if (d < bd) { bd = d; best = s; } }
          if (best) {
            const was = best.p;
            best.p = Math.min(1, best.p + dt * 0.28);
            it.paint = Math.max(0, it.paint - dt * 0.22);
            p.act = 1;
            if (was < 1 && best.p >= 1) Coop.emit("segDone", best.x, best.z);
            if (Math.random() < dt * 4) Coop.emit("brush", best.x, best.z);
          }
        } else if (inp.bP) Coop.emit("say", p.x, p.z, "Brush is dry, back to the paint can!", "#efe0b0");
      } else if (it.t === "hose") {
        const nest = G.nest;
        if (nest.hp > 0 && near(p, nest, 160)) {
          nest.hp = Math.max(0, nest.hp - dt);
          p.act = 3;
          for (const w of wasps) if (near(w, p, 170)) { w.scared = 1.5; }
          if (nest.hp <= 0) Coop.emit("nestDown", nest.x, nest.z);
        } else if (inp.bP) Coop.emit("splash", p.x + p.fx * 40, p.z + p.fz * 40);
        else p.act = 4;
      }
    } else if (inp.bP && !it && near(p, SDOOR, 80) && G.logsIn >= L.logs && !G.saunaLit) {
      G.saunaLit = true; Coop.emit("saunaLit", SDOOR.x, SDOOR.z);
    } else if (inp.bP && !p.hold) {
      // tyhjin käsin: "huikkaa" kaverille
      Coop.emit("say", p.x, p.z, pick(["Hey!", "Over here!", "Lift!", "Grab that!"]), COLS[p.i]);
    }
  }
  // lankut: liikkuvat vain, kun molemmissa päissä on kantaja
  for (const pl of planks) {
    if (pl.placed) continue;
    const h = pl.holders.filter((x) => x != null);
    if (h.length === 2) {
      const a = P[pl.holders[0]], b = P[pl.holders[1]];
      // päät seuraavat kantajia
      pl.x = (a.x + b.x) / 2; pl.z = (a.z + b.z) / 2;
      pl.a = Math.atan2(b.z - a.z, b.x - a.x);
      const d = Math.hypot(b.x - a.x, b.z - a.z);
      // kantajat pysyvät lankun mitan päässä toisistaan
      if (Math.abs(d - pl.len) > 2) {
        const k = ((d - pl.len) / d) * 0.5;
        a.x += (b.x - a.x) * k; a.z += (b.z - a.z) * k; b.x -= (b.x - a.x) * k; b.z -= (b.z - a.z) * k;
      }
      if (d > pl.len + 120) { drop(a); drop(b); }
      // terassille
      if (Math.abs(pl.x - TERRACE.x) < TERRACE.w / 2 - 20 && Math.abs(pl.z - TERRACE.z) < TERRACE.d / 2) {
        pl.placed = true; G.planksIn++;
        for (const q of P) if (q.hold && q.hold.t === "plank" && q.hold.id === pl.id) q.hold = null;
        pl.holders = [null, null];
        pl.a = 0; pl.x = TERRACE.x; pl.z = TERRACE.z - TERRACE.d / 2 + 14 + (G.planksIn - 1) * ((TERRACE.d - 20) / Math.max(1, L.planks - 1));
        Coop.emit("plankIn", pl.x, pl.z, G.planksIn);
      }
    } else if (h.length === 1) {
      // yksin: pitää kiinni, mutta ei saa liikkeelle
      const p = P[h[0]], e = pl.holders[1] === h[0] ? 1 : -1;
      const ex = pl.x + Math.cos(pl.a) * pl.len / 2 * e, ez = pl.z + Math.sin(pl.a) * pl.len / 2 * e;
      const d = Math.hypot(p.x - ex, p.z - ez);
      if (d > 30) { p.x = ex + ((p.x - ex) / d) * 30; p.z = ez + ((p.z - ez) / d) * 30; }
    }
  }
  // liike ja törmäykset
  for (const p of P) {
    p.x += p.vx * dt; p.z += p.vz * dt;
    p.x = clamp(p.x, 20, YW - 20); p.z = clamp(p.z, 20, YH - 20);
    for (const s of SOLIDS) pushOut(p, PR, s);
    // järvi
    if (p.x > 1380) p.x = 1380;
  }
  { const [a, b] = P; const d = Math.hypot(b.x - a.x, b.z - a.z); if (d < PR * 2 && d > 0) { const k = (PR * 2 - d) / d / 2; a.x -= (b.x - a.x) * k; a.z -= (b.z - a.z) * k; b.x += (b.x - a.x) * k; b.z += (b.z - a.z) * k; } }
  // kannetut esineet seuraavat
  for (const it of items) {
    if (it.holder != null) { const p = P[it.holder]; it.x = p.x + p.fx * 20; it.z = p.z + p.fz * 20; }
  }
  // sauna lämpenee
  if (G.saunaLit) G.temp = Math.min(80, G.temp + dt * 3);
  // ampiaiset
  const nest = G.nest;
  for (const w of wasps) {
    w.t += dt;
    w.cd = Math.max(0, w.cd - dt);
    if (nest.hp <= 0) { w.y += 60 * dt; w.x += Math.cos(w.ph) * 80 * dt; w.z += Math.sin(w.ph) * 80 * dt; continue; }
    let target = null;
    if (w.scared > 0) w.scared -= dt;
    else for (const p of P) if (p.stun <= 0 && near(p, nest, 160) && (!target || Math.hypot(p.x - w.x, p.z - w.z) < Math.hypot(target.x - w.x, target.z - w.z))) target = p;
    let tx, tz;
    if (target && w.cd <= 0) { tx = target.x; tz = target.z; }
    else { tx = nest.x + Math.cos(w.t * 2 + w.ph) * 50; tz = nest.z + Math.sin(w.t * 2.3 + w.ph) * 50; }
    if (w.scared > 0) { tx = nest.x + Math.cos(w.ph) * 160; tz = nest.z + Math.sin(w.ph) * 160; }
    const dx = tx - w.x, dz = tz - w.z, d = Math.hypot(dx, dz) || 1;
    const sp = target ? 150 + G.lv * 8 : 90;
    w.vx = lerp(w.vx, (dx / d) * sp, Math.min(1, 3 * dt)); w.vz = lerp(w.vz, (dz / d) * sp, Math.min(1, 3 * dt));
    w.x += w.vx * dt; w.z += w.vz * dt;
    if (target && w.cd <= 0 && near(w, target, 20)) {
      w.cd = 4; target.stun = 1; G.stings++;
      Coop.emit("sting", target.x, target.z, target.i);
    }
  }
  // valmis?
  const done = tasks();
  if (done.all && !G.doneT) { G.doneT = 1; Coop.emit("allDone"); }
  if (done.all) { G.doneT += dt; if (G.doneT > 2.5) return finish(true); }
  if (G.time <= 0) { G.time = 0; return finish(done.all); }
}
function tasks() {
  const paint = segs.reduce((a, s) => a + s.p, 0) / segs.length;
  const t = { paint, plank: G.planksIn, sauna: G.saunaLit, wasp: G.nest.hp <= 0 };
  t.all = paint >= 0.999 && t.plank >= L.planks && t.sauna && t.wasp;
  return t;
}
function finish(ok) {
  const t = tasks();
  Coop.end({
    ok,
    kicker: "Cabin " + G.lv,
    title: ok ? "The guests are here and the cabin is ready!" : "The guests came too early",
    text: ok ? pick(["The sauna is warm, the walls are red and there's room to dance on the deck. Happy Midsummer!", "The boss tasted a grilled sausage and nodded in approval."]) : pick(["The cabin is still a bit unfinished. Another try next Midsummer.", "The guests stare at wet walls and wasps. Yikes."]),
    stamp: ok ? "DONE" : "UNFINISHED",
    stats: [["Walls painted", Math.round(t.paint * 100) + " %"], ["Deck planks", t.plank + " / " + L.planks], ["Sauna", t.sauna ? "warm (" + Math.round(G.temp) + " °C)" : "cold"], ["Wasp nest", t.wasp ? "removed" : "still there"], ["Wasp stings", G.stings]],
    next: "Next cabin",
  });
}

// ---------- nettipeli ----------
const r1 = (v) => Math.round(v * 10) / 10, r2 = (v) => Math.round(v * 100) / 100;
function snapshot() {
  return {
    t: r1(G.time), li: G.logsIn, pi: G.planksIn, sl: G.saunaLit ? 1 : 0, tp: r1(G.temp), nh: r2(G.nest.hp), st: G.stings, dn: G.doneT ? 1 : 0,
    P: P.map((p) => [r1(p.x), r1(p.z), r2(p.fx), r2(p.fz), r2(p.stun), p.act, p.hold ? (p.hold.t === "plank" ? 1000 + p.hold.id : p.hold.id) : -1]),
    I: items.map((i) => [i.id, i.t, r1(i.x), r1(i.z), i.holder == null ? -1 : i.holder, i.placed ? 1 : 0, r2(i.paint || 0)]),
    K: planks.map((q) => [r1(q.x), r1(q.z), r2(q.a), q.placed ? 1 : 0, q.holders[0] == null ? -1 : q.holders[0], q.holders[1] == null ? -1 : q.holders[1]]),
    S: segs.map((s) => r2(s.p)),
    W: wasps.map((w) => [r1(w.x), r1(w.y), r1(w.z)]),
  };
}
function apply(s, first) {
  G.time = s.t; G.logsIn = s.li; G.planksIn = s.pi; G.saunaLit = !!s.sl; G.temp = s.tp; G.nest.hp = s.nh; G.stings = s.st; G.doneT = s.dn;
  s.P.forEach((a, i) => { const p = P[i]; p.tx = a[0]; p.tz = a[1]; p.fx = a[2]; p.fz = a[3]; p.stun = a[4]; p.act = a[5]; p.hold = a[6] < 0 ? null : a[6] >= 1000 ? { t: "plank", id: a[6] - 1000 } : { t: "item", id: a[6] }; if (first) { p.x = a[0]; p.z = a[1]; } });
  const byId = new Map(items.map((i) => [i.id, i]));
  items = s.I.map((a) => { const o = byId.get(a[0]) || { id: a[0], t: a[1], x: a[2], z: a[3] }; o.tx = a[2]; o.tz = a[3]; o.holder = a[4] < 0 ? null : a[4]; o.placed = !!a[5]; o.paint = a[6]; if (first || !byId.has(a[0])) { o.x = a[2]; o.z = a[3]; } return o; });
  s.K.forEach((a, i) => { const q = planks[i]; q.tx = a[0]; q.tz = a[1]; q.a = a[2]; q.placed = !!a[3]; q.holders = [a[4] < 0 ? null : a[4], a[5] < 0 ? null : a[5]]; if (first || q.placed) { q.x = a[0]; q.z = a[1]; } });
  s.S.forEach((v, i) => (segs[i].p = v));
  s.W.forEach((a, i) => { const w = wasps[i]; if (!w) return; w.tx = a[0]; w.ty = a[1]; w.tz = a[2]; if (first) { w.x = a[0]; w.y = a[1]; w.z = a[2]; } });
}

// ---------- 3D ----------
const renderer = new THREE.WebGLRenderer({ canvas: $("gl"), antialias: true });
renderer.setPixelRatio(Math.min(1.5, devicePixelRatio || 1));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
const scene = new THREE.Scene();
scene.background = new THREE.Color("#a9d4f0");
scene.fog = new THREE.Fog("#a9d4f0", 1600, 3600);
const camera = new THREE.PerspectiveCamera(42, 1, 5, 7000);
scene.add(new THREE.HemisphereLight("#e8f6ff", "#4a5a30", 0.6));

    case "plankIn": T_(200, 0.08, "square", 0.1); T_(200, 0.08, "square", 0.1, null, 0.12); T_(200, 0.08, "square", 0.1, null, 0.24); text(a[0], a[1], "NAILED! " + a[2] + "/" + L.planks, "#7ee081", 20); shake = 5; break;
    case "sting": T_(1200, 0.08, "sawtooth", 0.06, 1800); T_(500, 0.2, "sawtooth", 0.06, 300, 0.08); text(a[0], a[1], "STUNG!", "#ff6b5e", 24); shake = 6; break;
    case "nestDown": [523, 659, 784, 1046].forEach((f, i) => T_(f, 0.15, "triangle", 0.08, null, i * 0.08)); text(a[0], a[1], "NEST DOWN!", "#7ee081", 26); Coop.toast("WASPS GONE<small>The yard is peaceful again</small>", 2000, true); break;
    case "splash": splash(a[0], a[1], "#9fd3ff", 8); break;
    case "say": text(a[0], a[1], a[2], a[3] || "#fff", 16, 1.2); break;
    case "allDone": Coop.toast("ALL DONE!<small>The guests are pulling into the yard…</small>", 2400, true); break;
  }
}

// ---------- Coop ----------
function init(seed, lv, quiet) {
  L = level(lv);
  G = { seed, lv, t: 0, time: L.time, logsIn: 0, planksIn: 0, saunaLit: false, temp: 20, stings: 0, nid: 0, doneT: 0, nestFall: 0 };
  const R = mulberry32(seed);
  // ampiaispesä jossain mökin nurkassa
  const corner = Math.floor(R() * 4);
  G.nest = { x: COT.x + (corner % 2 ? 1 : -1) * (COT.w / 2 + 18), z: COT.z + (corner < 2 ? -1 : 1) * (COT.d / 2 + 18), hp: L.nest };
  buildSegments();
  P = [mkP(0), mkP(1)];
  items = [];
  for (let i = 0; i < 2; i++) items.push({ id: G.nid++, t: "brush", x: BUCKET.x - 40 + i * 80, z: BUCKET.z + 30, holder: null, paint: 0 });
  items.push({ id: G.nid++, t: "hose", x: PUMP.x - 40, z: PUMP.z, holder: null });
  planks = Array.from({ length: L.planks }, (_, i) => ({ id: i, x: LUMBER.x, z: LUMBER.z - 40 + i * 26, a: 0, len: 170, holders: [null, null], placed: false }));
  wasps = Array.from({ length: L.wasps }, (_, i) => ({ x: G.nest.x, y: 60, z: G.nest.z, vx: 0, vz: 0, t: R() * 5, ph: R() * 6.28, cd: 2, scared: 0 }));
  fx = []; texts = [];
  buildWorld();
  camX = (P[0].x + P[1].x) / 2; camZ = P[0].z - 100; camD = 900;
  hudKey = "";
  if (quiet) return;
  showHud(true);
  Coop.toast("CABIN " + lv + "<small>Midsummer guests arrive in " + Math.round(L.time / 60) + " minutes</small>", 2600, true);
}
function preview() {
  init(777, 1, true);
  showHud(false);
  segs.forEach((s, i) => (s.p = i < 4 ? 1 : i === 4 ? 0.5 : 0));
  P[0].x = 500; P[0].z = 560; P[1].x = 700; P[1].z = 700;
  camX = 700; camZ = 520; camD = 1100;
}
if (location.hash === "#test") window.__g = { get P() { return P; }, get G() { return G; }, get items() { return items; }, get planks() { return planks; }, get segs() { return segs; }, get L() { return L; }, step, tasks, SDOOR, BUCKET, WOOD, PUMP, TERRACE, snapCam: (x, z, d) => { camX = x; camZ = z; camD = d; } };

    "<kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd> move<br><kbd>Enter</kbd> carry (hold) · <kbd>Right Shift</kbd> use (hold)",
