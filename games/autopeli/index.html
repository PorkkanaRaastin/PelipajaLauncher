<title>Turbo Laps</title>
<style>

@keyframes pl{50%{opacity:.55}}

#wheel{position:fixed;left:50%;bottom:-70px;width:min(460px,80vw);transform:translateX(-50%);display:none;pointer-events:none}

#l{left:16px}#r{right:16px}

<script src="../_shared/three.min.js"></script>
<script>
let LAPS=3;const N=1800,MAXV=83,ACC=12,BRK=42,TURN=1.9,GT=5.9,BAR=8.4;
const $=id=>document.getElementById(id);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x78beff);scene.fog=new THREE.Fog(0x78beff,250,700);
const cam=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,1,1500);
const ren=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});ren.shadowMap.enabled=true;ren.shadowMap.type=THREE.PCFShadowMap;let PR=Math.min(devicePixelRatio,1.5);ren.setPixelRatio(PR);ren.setSize(innerWidth,innerHeight);
document.body.appendChild(ren.domElement);
const hemi=new THREE.HemisphereLight(0xffffff,0x667766,0.8);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,0.85);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
const sc=sun.shadow.camera;sc.left=-90;sc.right=90;sc.top=90;sc.bottom=-90;sc.near=1;sc.far=320;sun.shadow.bias=-0.0006;sun.shadow.normalBias=0.05;
scene.add(sun,sun.target);
const MATC={},mat=c=>MATC[c]||(MATC[c]=new THREE.MeshLambertMaterial({color:c}));
const UB=new THREE.BoxGeometry(1,1,1);UB.shared=true;
function box(w,h,d,c,x=0,y=0,z=0,p=world){const m=new THREE.Mesh(UB,mat(c));m.scale.set(w,h,d);m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;m.updateMatrix();m.matrixAutoUpdate=false;p.add(m);return m;}

// ---- radat ja vuodenaikateemat ----
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const TR=[
{n:'Spring',e:'🌸',d:'Flower Meadow',col:'#3f8f5a',sky:0x9fd8ff,gr:0x6cc26a,road:0x3c3c41,leaf:[0xf6a6c8,0xffc0dd,0x8fd36a],hw:14,grip:1,pine:.1,fall:0xffc0dd,fs:6,ob:['oil','oil','puddle','cones'],g:{"R":843.4250677299872,"a2":0.08144140304066241,"p2":1.62397223261185,"a3":0.09895346285775304,"p3":0.7498313783667981,"k1":33,"A1":51.897836757823825,"q1":2.566457271045074,"k2":10,"A2":77.78983946889639,"q2":1.575387570410967,"e":5,"pe":4.463879312677309}},
{n:'Summer',e:'☀️',d:'Sunshine Circuit',col:'#c98a1a',sky:0x4fb3ff,gr:0x4aa23a,road:0x45454a,leaf:[0x1e8c28,0x2fb035,0x23a02f],hw:16,grip:1,pine:.15,fall:0,fs:0,ob:['oil','sand','sand','cones'],g:{"R":980.8755589027814,"a2":0.06114646134898066,"p2":5.432399065028877,"a3":0.09830415157601237,"p3":4.36232856486924,"k1":34,"A1":50.13222062261775,"q1":3.054290100373328,"k2":9,"A2":90.6290054996498,"q2":3.495521296048537,"e":3,"pe":4.6717735711764545}},
{n:'Autumn',e:'🍂',d:'Forest Trail',col:'#a8501a',sky:0xd9b38c,gr:0x8a7a3a,road:0x3a3633,leaf:[0xd9531e,0xe8a317,0xb5341c],hw:12,grip:1,pine:.4,fall:0xe8a317,fs:7,ob:['oil','leaves','leaves','puddle'],g:{"R":886.519864427532,"a2":0.0686206762958318,"p2":4.087258522519842,"a3":0.033831289820373055,"p3":3.1366009208280596,"k1":35,"A1":59.00543305370957,"q1":4.193760888446122,"k2":9,"A2":86.82115676114336,"q2":6.193237445922569,"e":4,"pe":0.1544641950633377}},
{n:'Winter',e:'❄️',d:'Iceland – slippery!',col:'#4a7aa8',sky:0xcfe6f5,gr:0xf2f6fa,road:0x59616a,leaf:[0x2e6b4a,0x2a5d44,0x3a7a58],hw:13,grip:.8,pine:.85,snow:1,fall:0xffffff,fs:9,ob:['ice','ice','oil','snow','cones'],g:{"R":918.283809829269,"a2":0.1268619020283222,"p2":1.4927407125663013,"a3":0.07948716308921575,"p3":5.5080410624947405,"k1":35,"A1":56.77985859103501,"q1":4.998701926479116,"k2":9,"A2":143.0365350167267,"q2":4.1706767544709145,"e":3,"pe":5.069726392673329}}];
const DIFS=[['Easy',.8,'#2e8b57'],['Normal',.98,'#c78a00'],['Hard',1.2,'#c0392b']];
let world,pts,Tn,ta,mc,HW=13,TH=TR[0],inMenu=true,DM=1,paused=false,carsOn=false,camMode=0,steerVis=0,curTrack=0,rec=null,newRec=false,spc=4,mode="race",career=null,sel=0,lastBs=-1,OB=[];
// putoavat hiutaleet / lehdet
const fxg=new THREE.BufferGeometry(),fxa=new Float32Array(900);
for(let i=0;i<300;i++){fxa[i*3]=(Math.random()-.5)*240;fxa[i*3+1]=Math.random()*70;fxa[i*3+2]=(Math.random()-.5)*240;}
fxg.setAttribute('position',new THREE.BufferAttribute(fxa,3));
const fxm=new THREE.PointsMaterial({size:1.8,transparent:true,opacity:.9}),fx=new THREE.Points(fxg,fxm);
fx.frustumCulled=false;scene.add(fx);let fxs=8;
function ribbon(a,b,y,fn){const P=[],C=[],I=[];
  for(let i=0;i<N;i++){const j=(i+1)%N,c=new THREE.Color(fn(i));
    for(const [k,o] of [[i,a],[i,b],[j,b],[j,a]]){P.push(pts[k].x+Tn[k][1]*o,y,pts[k].z-Tn[k][0]*o);C.push(c.r,c.g,c.b);}
    const q=i*4;I.push(q,q+1,q+2,q,q+2,q+3);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(C,3));g.setIndex(I);g.computeVertexNormals();
  const m=new THREE.Mesh(g,new THREE.MeshLambertMaterial({vertexColors:true,side:THREE.DoubleSide}));m.receiveShadow=true;m.matrixAutoUpdate=false;world.add(m);}
function gdist(x,z){let m=1e9;for(const p of pts)m=Math.min(m,(p.x-x)**2+(p.z-z)**2);return Math.sqrt(m);}
const MT=[0x8aa6a0,0x6f8f86,0x8a6a55,0x9fb2c4];
function genPts(g,n){
  const M=26000,X=new Float32Array(M+1),Z=new Float32Array(M+1),C=new Float32Array(M+1),TP=Math.PI*2;
  for(let i=0;i<=M;i++){const th=i/M*TP,e=Math.min(th,TP-th)/.22,w=e>=1?1:e*e,
    env=.3+.7*(.5+.5*Math.sin(g.e*th+g.pe)),
    r=g.R*(1+g.a2*Math.sin(2*th+g.p2)+g.a3*Math.sin(3*th+g.p3))+w*env*(g.A1*Math.sin(g.k1*th+g.q1)+g.A2*Math.sin(g.k2*th+g.q2));
    X[i]=r*Math.sin(th);Z[i]=r*Math.cos(th);if(i)C[i]=C[i-1]+Math.hypot(X[i]-X[i-1],Z[i]-Z[i-1]);}
  const L=C[M],P=[];let j=0;
  for(let q=0;q<n;q++){const t=q/n*L;while(C[j+1]<t)j++;const f=(t-C[j])/(C[j+1]-C[j]||1);P.push({x:X[j]+(X[j+1]-X[j])*f,z:Z[j]+(Z[j+1]-Z[j])*f});}
  return {P,L};}
const GTX=(()=>{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');x.fillStyle='#e8e8e8';x.fillRect(0,0,128,128);
  for(let i=0;i<700;i++){const v=165+Math.random()*90|0;x.fillStyle=`rgb(${v},${v},${v})`;x.fillRect(Math.random()*128,Math.random()*128,3+Math.random()*3,3+Math.random()*3);}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(1700,1700);t.magFilter=THREE.NearestFilter;return t;})();
const CG={},coneGeo=n=>CG[n]||(CG[n]=Object.assign(new THREE.ConeGeometry(1,1,n),{shared:true}));
const SG=Object.assign(new THREE.SphereGeometry(1,9,7),{shared:true}),CIRC=Object.assign(new THREE.CircleGeometry(1,18),{shared:true});
const stat=m=>{m.updateMatrix();m.matrixAutoUpdate=false;return m;};
function cone(r,h,c,x,y,z,seg=8){const m=new THREE.Mesh(coneGeo(seg),mat(c));m.scale.set(r,h,r);m.position.set(x,y,z);m.castShadow=true;world.add(stat(m));return m;}
function blob(r,c,x,y,z,sy=1){const m=new THREE.Mesh(SG,mat(c));m.scale.set(r,r*sy,r);m.position.set(x,y,z);m.castShadow=true;world.add(stat(m));return m;}
const PM={},pmat=(c,sh,op)=>{const k=c+'_'+sh+'_'+op;return PM[k]||(PM[k]=new THREE.MeshPhongMaterial({color:c,shininess:sh,specular:0x99aabb,transparent:op<1,opacity:op}));};
function disc(r,mt,x,y,z){const m=new THREE.Mesh(CIRC,mt);m.rotation.x=-Math.PI/2;m.scale.set(r,r,1);m.position.set(x,y,z);m.receiveShadow=true;world.add(stat(m));}
function mkObs(o){const {x,z,r,k}=o;
  if(k=='oil'){disc(r,pmat(0x07070b,160,1),x,.17,z);disc(r*.55,pmat(0x20203a,200,.8),x+r*.15,.18,z-r*.1);}
  else if(k=='ice')disc(r,pmat(0xc6ecff,200,.85),x,.17,z);
  else if(k=='puddle')disc(r,pmat(0x3f78b0,120,.78),x,.17,z);
  else if(k=='sand')disc(r,pmat(0xd8c27a,5,1),x,.17,z);
  else if(k=='leaves'){disc(r,pmat(0xd9531e,5,1),x,.17,z);disc(r*.6,pmat(0xe8a317,5,1),x+r*.2,.18,z+r*.15);disc(r*.4,pmat(0xb5341c,5,1),x-r*.3,.19,z-r*.1);}
  else if(k=='snow')blob(r*.9,0xffffff,x,.3,z,.35);
  else for(let i=0;i<3;i++){const a=i*2.09;cone(.55,1.5,0xff6a00,x+Math.sin(a)*1.3,.75,z+Math.cos(a)*1.3,8);}}
function buildTrack(t){
  TH=t;HW=t.hw;seed=7;
  if(world){scene.remove(world);world.traverse(o=>{if(o.geometry&&!o.geometry.shared)o.geometry.dispose();});}
  world=new THREE.Group();scene.add(world);
  scene.background=new THREE.Color(t.sky);scene.fog=new THREE.Fog(t.sky,500,2000);
  hemi.color.set(t.sky);hemi.groundColor.set(t.gr);
  fx.visible=!!t.fall;if(t.fall){fxm.color.set(t.fall);fxs=t.fs;}
  const gp=genPts(t.g,N);pts=gp.P;Tn=[];ta=[];spc=gp.L/N;
  for(let i=0;i<N;i++){const a=pts[(i+1)%N],b=pts[(i+N-1)%N];let x=a.x-b.x,z=a.z-b.z;const l=Math.hypot(x,z);x/=l;z/=l;Tn.push([x,z]);ta.push(Math.atan2(x,z));}
  const cv=ta.map((a,i)=>{let d=ta[(i+10)%N]-a;d=Math.atan2(Math.sin(d),Math.cos(d));return Math.abs(d);});
  mc=cv.map((_,i)=>{let m=0;for(let j=0;j<55;j++)m=Math.max(m,cv[(i+j)%N]);return m;});
  let ext=0;for(const p of pts)ext=Math.max(ext,Math.hypot(p.x,p.z));
  const g=new THREE.Mesh(new THREE.PlaneGeometry(9000,9000),new THREE.MeshLambertMaterial({color:t.gr,map:GTX}));
  g.rotation.x=-Math.PI/2;g.position.y=-0.1;g.receiveShadow=true;world.add(stat(g));
  ribbon(-HW,HW,0.06,i=>i%2?t.road:t.road+0x050505);
  ribbon(HW,HW+1.4,0.14,i=>(i>>1)%2?0xe02020:0xffffff);
  ribbon(-HW-1.4,-HW,0.14,i=>(i>>1)%2?0xe02020:0xffffff);
  ribbon(-0.25,0.25,0.1,i=>(i>>2)%2?0xffffff:t.road);
  const sg=new THREE.Group();sg.position.set(pts[0].x,0,pts[0].z);sg.rotation.y=ta[0];world.add(sg);
  for(let r=0;r<2;r++)for(let k=0;k<12;k++)box(2*HW/12,0.06,1.4,(k+r)%2?0x000000:0xffffff,-HW+HW/12+k*2*HW/12,0.12,r*1.4,sg);
  for(const q of [-1,1])box(1.2,11,1.2,0x2a2a35,q*(HW+3),5.5,0,sg);
  for(let k=0;k<16;k++)box((2*HW+6)/16,2,1.6,k%2?0xffffff:0x111111,-(HW+3)+(k+.5)*(2*HW+6)/16,11.5,0,sg);
  for(let k=0;k<3;k++){const h=1.6*(k+1);box(2.4,h,34,0x80808a,HW+6+k*2.4,h/2,-8,sg);

    h=`<h2>🏁 FINISH! TOP 3</h2><ol>${o.slice(0,3).map(c=>`<li class="${c.me?'me':''}">${c.nm} – ${f(c)}</li>`).join('')}</ol>`+(p>3?`<div>YOUR POSITION: ${p}.</div>`:'')+`<div style="margin-top:6px">BEST LAP ${me.bestLap?fmt(me.bestLap):'--'}${newRec?' ★ RECORD':''}</div>`;
    if(mode=='career'){
      o.forEach((c,i)=>career.pts[c.nm]=(career.pts[c.nm]||0)+(PTS[i]||0));career.round++;
      store.set('ap_career',career.round<TR.length?JSON.stringify(career):'');
      const st=Object.entries(career.pts).sort((a,b)=>b[1]-a[1]),mp=st.findIndex(e=>e[0]==me.nm)+1;
      h+=`<div style="margin-top:12px;color:#ffd54a">CHAMPIONSHIP POINTS</div><ol>${st.slice(0,3).map(e=>`<li class="${e[0]==me.nm?'me':''}">${e[0]} – ${e[1]} p</li>`).join('')}</ol>`+(mp>3?`<div>YOU: ${mp}. (${career.pts[me.nm]} p)</div>`:'');
      if(career.round>=TR.length)h+=`<div style="color:#ffd54a;margin-top:8px">${mp==1?'🏆 YOU ARE THE CHAMPION!':'CAREER OVER'}</div>`;
    }}
  const nx=mode=='career'&&career.round<TR.length;
  h+='<div style="margin-top:14px">'+(nx?'<button class="card mini" id="rn" style="--c:#2e8b57">NEXT ▶</button>':(mode=='career'?'':'<button class="card mini" id="rr" style="--c:#2e8b57">AGAIN</button>'))+'<button class="card mini" id="rm" style="--c:#a8501a">MENU</button></div>';
  $('res').innerHTML=h;$('res').style.display='block';
  if($('rn'))$('rn').onclick=()=>startRace(career.round,career.d);if($('rr'))$('rr').onclick=()=>reset();if($('rm'))$('rm').onclick=toMenu;}

const bulbs=document.querySelectorAll('.b');
let fa=0,fn=0;const MAXPR=Math.min(devicePixelRatio,1.5);
function adapt(dt){fa+=dt;if(++fn<45)return;const av=fa/fn;fa=fn=0;
  if(av>.025&&PR>.7){PR=Math.max(.7,PR-.2);ren.setPixelRatio(PR);ren.setSize(innerWidth,innerHeight);}
  else if(av<.0145&&PR<MAXPR){PR=Math.min(MAXPR,PR+.1);ren.setPixelRatio(PR);ren.setSize(innerWidth,innerHeight);}}
function frame(now){
  const dt=Math.min((now-last)/1000,0.05);last=now;
  if(paused){ren.render(scene,cam);requestAnimationFrame(frame);return;}
  adapt(dt);
  fx.position.set(cam.position.x,0,cam.position.z);
  {const a=fxa;for(let i=1;i<a.length;i+=3){a[i]-=fxs*dt;if(a[i]<0)a[i]+=70;}fxg.attributes.position.needsUpdate=true;}
  if(inMenu){const a=now/7000;cam.position.set(Math.sin(a)*560,430,Math.cos(a)*560);cam.lookAt(0,0,0);cam.fov=60;sun.position.set(80,150,60);sun.target.position.set(0,0,0);cam.updateProjectionMatrix();
    $('lights').style.opacity=0;$('redov').style.display='none';$('wrong').style.display='none';$('wheel').style.display='none';$('msg').style.display='none';ren.render(scene,cam);requestAnimationFrame(frame);return;}
  clock+=dt;
  const lit=clock<1?0:Math.min(5,Math.floor((clock-1)/0.9)+1);
  if(!go&&clock>=GT){go=true;race=0;}
  {const bs=clock>=GT?9:lit;if(bs!==lastBs){lastBs=bs;bulbs.forEach((b,i)=>b.className='b'+(clock>=GT?' g':i<lit?' r':''));}}
  $('lights').style.opacity=clock>GT+1.5?0:1;
  if(go)race+=dt;
  cars.forEach(c=>drive(c,dt));
  for(let i=0;i<cars.length;i++)for(let j=i+1;j<cars.length;j++){
    const a=cars[i],b=cars[j],dx=b.x-a.x,dz=b.z-a.z,d=Math.hypot(dx,dz);
    if(d<3.6&&d>0.01){const o=(3.6-d)/2,nx=dx/d,nz=dz/d;a.x-=nx*o;a.z-=nz*o;b.x+=nx*o;b.z+=nz*o;a.v*=.985;b.v*=.985;
      if(a.me||b.me){const pl=a.me?a:b,q=a.me?b:a;if(go&&pl.spin<=0&&pl.imm<=0&&(Math.abs(pl.v)>8||Math.abs(pl.v-q.v)>8)){pl.spin=.9;pl.dir=Math.random()<.5?-1:1;pl.why='CRASH!';thud(.7);}else if(pl.spin<=0)thud(.12);}}}
  cars.forEach(c=>{
    const ni=near(c);let dl=ni-c.idx;if(dl<-N/2)dl+=N;if(dl>N/2)dl-=N;c.prog+=dl;c.idx=ni;
    if(c.d>HW+BAR){const q=pts[ni],k=(HW+BAR)/c.d;c.x=q.x+(c.x-q.x)*k;c.z=q.z+(c.z-q.z)*k;c.d=HW+BAR;c.v*=Math.exp(-4*dt);if(c.me&&Math.abs(c.v)>20)thud(.3);}
    if(c.fin==null&&c.prog>=LAPS*N)c.fin=race;
    if(c.me){const Lc=Math.floor(c.prog/N);if(Lc>c.lapN){if(Lc>=1&&Lc<=LAPS)lapDone(race-c.lapT0);c.lapT0=race;c.lapN=Lc;}}
    if(go&&c.spin<=0&&c.obsCd<=0)for(const o of OB){const dx=c.x-o.x,dz=c.z-o.z,rr=o.r+1.1;if(dx*dx+dz*dz<rr*rr){hitObs(c,o);break;}}
    c.mesh.position.set(c.x,0.12,c.z);c.mesh.rotation.y=c.ang;c.lab.position.set(c.x,4,c.z-4.5);});
  {const T=Tn[me.idx],dot=Math.sin(me.ang)*T[0]+Math.cos(me.ang)*T[1],w=go&&!me.fin&&me.spin<=0&&me.auto<=0&&dot<-.3&&me.v*dot<4;
    me.wrongT=w?Math.min(1,me.wrongT+dt):Math.max(0,me.wrongT-dt*3);
    if(!me.warn&&me.wrongT>=.7){me.warn=true;me.wcd=5;}else if(me.warn&&me.wrongT<.2)me.warn=false;
    if(me.warn){me.wcd-=dt;if(me.wcd<=0){me.auto=1;me.warn=false;me.wrongT=0;}}
    const sw=me.warn?'block':'none';$('redov').style.display=sw;$('wrong').style.display=sw;if(me.warn)setT('wcnt',String(Math.max(1,Math.ceil(me.wcd))));}
  audioUpdate(dt);me.mesh.userData.helm.visible=camMode!=2;cars.forEach(c=>c.lab.visible=carsOn&&!(c.me&&camMode==2));
  if(me.fin!=null&&!shown&&(cars.filter(c=>c.fin!=null).length>=Math.min(3,cars.length)||race-me.fin>12)){shown=true;results();}
  if(camMode==0){const k=Math.min(1,8*dt);
    {const sp=Math.abs(me.v),lx=me.x+Math.sin(me.ang)*sp*.8,lz=me.z+Math.cos(me.ang)*sp*.8;cam.position.x+=(lx-cam.position.x)*k;cam.position.y+=(70+sp*1.5-cam.position.y)*k;cam.position.z+=(lz-cam.position.z)*k;}
    cam.rotation.set(-Math.PI/2,0,0);cam.fov=70;
  }else if(camMode==1){const k=Math.min(1,6*dt);
    {const sp=Math.abs(me.v),dd=11+sp*.1;cam.position.x+=(me.x-Math.sin(me.ang)*dd-cam.position.x)*k;cam.position.y+=(6+sp*.04-cam.position.y)*k;cam.position.z+=(me.z-Math.cos(me.ang)*dd-cam.position.z)*k;}
    cam.lookAt(me.x,1,me.z);cam.fov=80+Math.abs(me.v)*.12;}
  else{const sx=Math.sin(me.ang),sz=Math.cos(me.ang);cam.position.set(me.x+sx*.3,1.25,me.z+sz*.3);cam.lookAt(me.x+sx*40,.9,me.z+sz*40);cam.rotateZ(-steerVis*.05);cam.fov=88;}
  cam.near=camMode==2?.2:1;
  sun.position.set(me.x+50,100,me.z+30);sun.target.position.set(me.x,0,me.z);
  cam.updateProjectionMatrix();
  const sIn=(keys.right?1:0)-(keys.left?1:0);
  steerVis+=((go&&me.spin<=0&&me.auto<=0&&!me.fin?sIn*(1-.4*Math.min(1,Math.abs(me.v)/MAXV)):0)-steerVis)*Math.min(1,9*dt);
  $('wsvg').style.transform='rotate('+(steerVis*105).toFixed(1)+'deg)';$('wtxt').textContent=Math.round(Math.abs(me.v)*4);
  $('wheel').style.display=camMode==2?'block':'none';setT('msg',me.spin>0?(me.why||'CRASH!'):(me.why||'SLOWED!'));$('msg').style.display=(me.spin>0||me.slowT>0)?'block':'none';
  setT('spd',Math.round(Math.abs(me.v)*4)+' km/h');
  setT('lap',(mode=='career'?'CAREER '+(career.round+1)+'/'+TR.length+' · ':'')+'LAP '+Math.min(LAPS,Math.max(1,Math.floor(me.prog/N)+1))+'/'+LAPS);
  setT('time','TIME '+race.toFixed(1)+' s');
  setT('pos',cars.length>1?'POS '+(order().indexOf(me)+1)+'/'+cars.length:'');
  setT('bl',(me.lastLap?'LAST '+fmt(me.lastLap)+'  ':'')+(rec!=null?'REC '+fmt(rec):''));
  ren.render(scene,cam);requestAnimationFrame(frame);}
cam.position.set(me.x,75,me.z);cam.rotation.set(-Math.PI/2,0,0);
requestAnimationFrame(frame);

// Pelipaja: Save & End Game
window.rrSaveGame=()=>{if(mode=='career'&&career&&career.round<TR.length)store.set('ap_career',JSON.stringify(career));};
