<script>
'use strict';
/* ---------- basics ---------- */
const cv=document.getElementById('c'),cx=cv.getContext('2d'),nameIn=document.getElementById('nameIn');
const TAU=Math.PI*2,INK='#3a2a22',PAPER='#f6eddc',FONT="'Patrick Hand','Segoe Print',cursive";
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
let W=0,H=0,S=1,OX=0,OY=0,DPR=1,T=0,BF=0;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);S=Math.min(W/1280,H/720);OX=(W-1280*S)/2;OY=(H-720*S)/2;placeInput();}
addEventListener('resize',resize);
function H1(n){const s=Math.sin(n*12.9898+78.233)*43758.5453;return s-Math.floor(s);}
// hand-drawn "boiling" wobble: lines shift between 3 variants a few times a second
function wb(seed,a){return(H1(seed*1.37+BF*7.11)-.5)*2*a;}
function smooth(p,closed=true){const n=p.length;cx.beginPath();if(closed){const a=p[n-1],b=p[0];cx.moveTo((a[0]+b[0])/2,(a[1]+b[1])/2);for(let i=0;i<n;i++){const c=p[i],d=p[(i+1)%n];cx.quadraticCurveTo(c[0],c[1],(c[0]+d[0])/2,(c[1]+d[1])/2);}cx.closePath();}
  else{cx.moveTo(p[0][0],p[0][1]);for(let i=1;i<n-1;i++){const c=p[i],d=p[i+1];cx.quadraticCurveTo(c[0],c[1],(c[0]+d[0])/2,(c[1]+d[1])/2);}cx.lineTo(p[n-1][0],p[n-1][1]);}}
function blob(x,y,rx,ry,seed,amt=1.5,N=24,fn=null,rot=0){const p=[],cr=Math.cos(rot),sr=Math.sin(rot);for(let i=0;i<N;i++){const a=i/N*TAU,m=fn?fn(a):1,w=wb(seed+i,amt);const px=Math.cos(a)*(rx*m+w),py=Math.sin(a)*(ry*m+w);p.push([x+px*cr-py*sr,y+px*sr+py*cr]);}smooth(p);}
function ink(w=3,c=INK){cx.lineWidth=w;cx.strokeStyle=c;cx.lineJoin='round';cx.lineCap='round';cx.stroke();}
function fillInk(col,w=3){cx.fillStyle=col;cx.fill();ink(w);}
function wline(x1,y1,x2,y2,seed,w=3,c=INK,bow=1.5){cx.beginPath();cx.moveTo(x1+wb(seed,1),y1+wb(seed+1,1));cx.quadraticCurveTo((x1+x2)/2+wb(seed+2,bow),(y1+y2)/2+wb(seed+3,bow),x2+wb(seed+4,1),y2+wb(seed+5,1));ink(w,c);}
function wrect(x,y,w,h,seed,a=1.6){const p=[[x,y],[x+w/2,y],[x+w,y],[x+w,y+h/2],[x+w,y+h],[x+w/2,y+h],[x,y+h],[x,y+h/2]].map((q,i)=>[q[0]+wb(seed+i,a),q[1]+wb(seed+i+9,a)]);
  cx.beginPath();cx.moveTo(p[0][0],p[0][1]);for(let i=1;i<=8;i++){const q=p[i%8];cx.lineTo(q[0],q[1]);}cx.closePath();}
function txt(s,x,y,size,col=INK,align='center',base='middle'){cx.font=size+'px '+FONT;cx.fillStyle=col;cx.textAlign=align;cx.textBaseline=base;cx.fillText(s,x,y);}
function circ(x,y,r){cx.beginPath();cx.arc(x,y,r,0,TAU);}

/* ---------- paper grain ---------- */
const grain=(()=>{const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');const d=g.createImageData(256,256);
  for(let i=0;i<d.data.length;i+=4){const v=Math.random();d.data[i]=90;d.data[i+1]=64;d.data[i+2]=40;d.data[i+3]=v<.5?Math.random()*22:v<.52?60:0;}g.putImageData(d,0,0);
  g.strokeStyle='rgba(120,85,50,.10)';g.lineWidth=1;for(let i=0;i<60;i++){const x=Math.random()*256,y=Math.random()*256,a=Math.random()*TAU,l=rnd(4,14);g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke();}
  return cx.createPattern(c,'repeat');})();

const STAGE=['egg','baby','little one','teen','grown up'],SCALE=[0,.66,.78,.9,1],NEED=[0,0,250,700,1500];
const FOODS={berries:{n:'berries',food:12,price:2},apple:{n:'apple',food:18,price:3},carrot:{n:'carrot',food:16,price:3},cupcake:{n:'cupcake',food:22,fun:8,dirty:8,price:5},pancakes:{n:'pancakes',food:32,price:7}};
const HATS={leaf:{n:'leaf',price:10},bow:{n:'bow',price:15},beanie:{n:'beanie',price:20},party:{n:'party hat',price:25},flowers:{n:'flower crown',price:35},crown:{n:'tiny crown',price:80}};
function newGame(){return{v:1,name:'',col:0,stage:0,xp:0,coins:25,st:{food:70,clean:90,fun:70,energy:85},inv:{berries:2,apple:3,carrot:1,cupcake:1,pancakes:0},hats:{},hat:'',dirt:[],mute:false,last:Date.now(),taps:0,best:0};}
let G;
try{G=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){G=null;}
if(!G||G.v!==1)G=newGame();
G=Object.assign(newGame(),G);G.st=Object.assign(newGame().st,G.st);G.inv=Object.assign({berries:0,apple:0,carrot:0,cupcake:0,pancakes:0},G.inv);
if(G.stage>=1&&!G.name)G.name='fuzz';
(function offline(){if(G.stage<1)return;const el=clamp((Date.now()-(G.last||Date.now()))/1000,0,3*86400);const r=.12*el;
  G.st.food=Math.max(12,G.st.food-.035*r);G.st.clean=Math.max(15,G.st.clean-.02*r);G.st.fun=Math.max(12,G.st.fun-.045*r);G.st.energy=Math.min(100,G.st.energy+.2*r);syncDirt();})();
function save(){G.last=Date.now();try{localStorage.setItem(KEY,JSON.stringify(G));}catch(e){}}
addEventListener('beforeunload',save);
window.rrSaveGame=()=>{if(MODE==='catch'&&catchG&&!catchG.over)endCatch();save();};
function syncDirt(){const want=Math.min(7,Math.floor((100-G.st.clean)/13));while(G.dirt.length<want){let u,v;do{u=rnd(-.85,.85);v=rnd(-.75,.85);}while(v<.15&&Math.abs(u)<.55||u*u+v*v>.9);G.dirt.push({u,v,a:1,k:Math.random()*99});}}

/* ---------- sound ---------- */
let AC=null,MG=null;
function audio(){if(AC){if(AC.state==='suspended')AC.resume();return;}try{AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=G.mute?0:.5;MG.connect(AC.destination);}catch(e){AC=null;}}
function tone(f,dur,type='sine',vol=.2,f2=null,delay=0){if(!AC)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(MG);o.start(t);o.stop(t+dur+.02);}
function noise(dur,vol=.2,freq=1200,delay=0,q=1){if(!AC)return;const t=AC.currentTime+delay,n=Math.floor(AC.sampleRate*dur),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=q;const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(g);g.connect(MG);s.start(t);}
const SFX={
  chirp(p=1){const b=(G.stage<=1?900:G.stage===2?780:G.stage===3?680:600)*p;tone(b,.09,'sine',.18,b*1.5);tone(b*1.3,.12,'sine',.16,b*.95,.08);},
  giggle(){for(let i=0;i<4;i++)tone(rnd(800,1000)*(G.stage<=1?1.2:1),.07,'sine',.12,rnd(1100,1300),i*.08);},
  sad(){tone(520,.35,'sine',.14,330);},
  pop(){tone(rnd(500,800),.06,'sine',.12,rnd(1200,1600));},
  chomp(){noise(.08,.25,600,0,2);tone(140,.06,'triangle',.12,90);},
  coin(){tone(990,.07,'square',.06);tone(1480,.12,'square',.06,null,.07);},
  click(){tone(420,.05,'triangle',.12,300);},
  splash(){noise(.25,.12,2400,0,.6);},
  squeak(){tone(rnd(1400,1800),.05,'sine',.05,rnd(2000,2400));},
  crack(){noise(.07,.3,3000,0,3);},
  bonk(){tone(220,.09,'triangle',.18,140);},
  yay(){[523,659,784,1046].forEach((f,i)=>tone(f,.22,'triangle',.12,null,i*.1));},
  hurt(){tone(300,.2,'sawtooth',.06,160);}};
let musT=0,musI=0;const MUS=[0,4,7,9,7,4,2,4,0,2,4,7,4,2,0,-3];
function music(dt){if(!AC||G.mute)return;musT-=dt;if(musT<=0){musT=.55;const n=MUS[musI++%MUS.length];const f=392*Math.pow(2,n/12);tone(f,.9,'sine',.035);if(musI%4===1)tone(f/2,1.2,'triangle',.025);}}

/* ---------- state ---------- */
let MODE=G.stage===0?'egg':G.name?'room':'name';
let tool='';           // '', feed, wash, play, sleep, shop
let washTool='soap',playPick=false,shopTab='food',banner=null,bubble=null,notes=[];
const PY=600;
const pet={x:640,tx:640,face:1,walk:0,h:0,vh:0,sq:0,vsq:0,blink:0,blinkT:2,lookX:0,lookY:0,mouth:0,mouthT:0,eatT:0,eatK:'',refuseT:0,happyT:0,asleep:false,wanderT:2,antA:0,antV:0,wiggle:0,shakeT:0,yawnT:0,lastX:640,petting:0,
  bx:640,by:500,rx:60,ry:54,mx:640,my:500};
let parts=[],foam=[],ball=null,drag=null,ptr={x:0,y:0,down:false,lx:0,ly:0,moved:0,downT:0},UI=[],egg={wig:0,cracks:G.taps||0,hatchT:0},saveT=0,catchG=null;

function addP(o){parts.push(Object.assign({vx:0,vy:0,g:0,life:1,max:1,r:6,rot:0,vr:0},o));}
function note(s,x,y){notes.push({s,x,y,t:2.2});}
function say(icon,t=2.2){bubble={icon,t};}
function gainXP(n){if(G.stage<1||G.stage>=4){G.xp+=n;return;}G.xp+=n;if(G.xp>=NEED[G.stage+1]){G.stage++;G.coins+=30;banner={s:G.name+' is growing up!',sub:'now a '+STAGE[G.stage]+'  ·  +30',t:3.5};SFX.yay();confetti();save();}}
function confetti(){for(let i=0;i<70;i++)addP({type:'conf',x:rnd(200,1080),y:rnd(-40,40),vx:rnd(-60,60),vy:rnd(40,160),g:120,life:rnd(2.5,4),r:rnd(5,9),rot:rnd(0,6),vr:rnd(-6,6),col:pick(['#e36b5d','#f0cf6e','#94cba7','#7fb6cf','#c3a6d8','#f0a07a'])});}
function setStat(k,v){G.st[k]=clamp(v,0,100);}
function mood(){const s=G.st;return Math.min(s.food,s.clean,s.fun,s.energy);}
function need(){const s=G.st,l=[['food',s.food],['clean',s.clean],['fun',s.fun],['energy',s.energy]].sort((a,b)=>a[1]-b[1]);return l[0][1]<35?l[0][0]:null;}

/* ---------- input ---------- */
function toL(e){return{x:(e.clientX-OX)/S,y:(e.clientY-OY)/S};}
function hitUI(x,y){for(let i=UI.length-1;i>=0;i--){const u=UI[i];const ok=u.r?Math.hypot(x-u.x,y-u.y)<u.r:(x>=u.x&&x<=u.x+u.w&&y>=u.y&&y<=u.y+u.h);if(ok)return u;}return null;}
cv.addEventListener('pointerdown',e=>{audio();const p=toL(e);ptr.x=ptr.lx=p.x;ptr.y=ptr.ly=p.y;ptr.down=true;ptr.moved=0;ptr.downT=T;try{cv.setPointerCapture(e.pointerId);}catch(_){}
  const u=hitUI(p.x,p.y);if(u){if(u.fn)u.fn();return;}onDown(p.x,p.y);});
cv.addEventListener('pointermove',e=>{const p=toL(e);ptr.moved+=Math.hypot(p.x-ptr.x,p.y-ptr.y);ptr.lx=ptr.x;ptr.ly=ptr.y;ptr.x=p.x;ptr.y=p.y;if(ptr.down)onDrag(p.x,p.y);const u=hitUI(p.x,p.y);cv.style.cursor=u||drag?'pointer':'default';});
addEventListener('pointerup',e=>{const p=toL(e);if(!ptr.down)return;ptr.down=false;onUp(p.x,p.y);});
addEventListener('keydown',e=>{if(e.target===nameIn)return;if(e.key==='Escape'){if(MODE==='room'&&tool)setTool('');}if(MODE==='catch'&&catchG)catchG.keys[e.key.toLowerCase()]=true;});
addEventListener('keyup',e=>{if(MODE==='catch'&&catchG)catchG.keys[e.key.toLowerCase()]=false;});
function onPet(x,y){const dx=(x-pet.bx)/(pet.rx*1.05),dy=(y-pet.by)/(pet.ry*1.15);return dx*dx+dy*dy<1.1;}
function onDown(x,y){
  if(MODE==='egg'){if(Math.hypot(x-640,y-450)<125)tapEgg();return;}
  if(MODE!=='room')return;
  if(tool==='sleep'){return;}
  if(tool==='feed'){const f=foodAt(x,y);if(f){if(G.inv[f]>0){drag={k:f,x,y};SFX.click();}else{note('none left',x,y-50);SFX.bonk();}}return;}
  if(tool==='play'&&ball&&Math.hypot(x-ball.x,y-ball.y)<ball.r+18){drag={ball:true,x,y,hist:[]};ball.held=true;return;}
  if(tool==='wash')return;
  if(onPet(x,y)){pet.petting=0.001;}
}
function onDrag(x,y){
  if(drag){drag.x=x;drag.y=y;if(drag.ball){drag.hist.push([x,y,T]);if(drag.hist.length>6)drag.hist.shift();ball.x=x;ball.y=y;ball.vx=ball.vy=0;}return;}
  if(MODE!=='room')return;
  if(tool==='wash'){washAt(x,y);return;}
  if(pet.petting&&onPet(x,y)){pet.petting+=Math.hypot(x-ptr.lx,y-ptr.ly);}
}
function onUp(x,y){
  if(drag){if(drag.ball){const h=drag.hist;if(h.length>1){const a=h[0],b=h[h.length-1],dt=Math.max(.016,b[2]-a[2]);ball.vx=clamp((b[0]-a[0])/dt,-1400,1400);ball.vy=clamp((b[1]-a[1])/dt,-1500,900);}ball.held=false;}
    else{const near=Math.hypot(x-pet.mx,y-pet.my)<95;if(near)feed(drag.k);}drag=null;return;}
  if(MODE==='room'&&!tool&&pet.petting){if(pet.petting<12&&onPet(x,y)){boop();}pet.petting=0;}
  pet.petting=0;
}
function boop(){if(pet.asleep)return;if(pet.h<=0){pet.vh=420;pet.vsq=-1.2;}SFX.chirp(rnd(.95,1.1));pet.happyT=.8;addP({type:'heart',x:pet.bx+rnd(-30,30),y:pet.by-pet.ry,vy:-60,life:1.2,max:1.2,r:12});gainXP(1);}

/* ---------- egg & naming ---------- */
function tapEgg(){if(egg.hatchT)return;egg.wig=1;egg.cracks++;G.taps=egg.cracks;SFX.crack();for(let i=0;i<4;i++)addP({type:'shell',x:640+rnd(-40,40),y:500+rnd(-40,20),vx:rnd(-120,120),vy:rnd(-200,-80),g:600,life:.8,max:.8,r:rnd(4,7),rot:rnd(0,6),vr:rnd(-8,8)});
  if(egg.cracks>=6){egg.hatchT=.01;}save();}
function hatch(){G.stage=1;G.xp=0;MODE='name';pet.x=pet.tx=640;pet.h=0;pet.vh=520;SFX.yay();
  for(let i=0;i<22;i++)addP({type:'shell',x:640+rnd(-60,60),y:500+rnd(-60,40),vx:rnd(-300,300),vy:rnd(-420,-120),g:700,life:1.4,max:1.4,r:rnd(7,14),rot:rnd(0,6),vr:rnd(-8,8)});confetti();openName();}
function openName(){nameIn.value=G.name||'';nameIn.style.display='block';placeInput();setTimeout(()=>{nameIn.focus();},50);}
function placeInput(){if(nameIn.style.display!=='block')return;const w=300*S,h=56*S;nameIn.style.left=(OX+640*S-w/2)+'px';nameIn.style.top=(OY+226*S)+'px';nameIn.style.width=w+'px';nameIn.style.height=h+'px';nameIn.style.fontSize=(44*S)+'px';}
nameIn.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter')confirmName();});
nameIn.addEventListener('input',()=>{nameIn.value=nameIn.value.replace(/[<>]/g,'');});
function confirmName(){const n=nameIn.value.trim();if(!n){nameIn.focus();SFX.bonk();return;}G.name=n.slice(0,12);nameIn.style.display='none';MODE='room';SFX.chirp();pet.happyT=1.5;save();
  banner={s:'hi, '+G.name,sub:'feed, wash and play to help it grow',t:3.5};}

/* ---------- actions ---------- */
function setTool(t){SFX.click();if(pet.asleep&&t!=='sleep'){wake();}
  if(tool===t)t='';if(tool==='play'){ball=null;}tool=t;playPick=t==='play';if(t!=='feed')drag=null;
  if(t==='sleep'){if(G.st.energy>92){say('nope');tool='';return;}}
  if(t==='wash'){washTool='soap';}}
function wake(){pet.asleep=false;tool='';pet.yawnT=1.2;SFX.chirp(.9);}
function foodAt(x,y){let i=0;for(const k in FOODS){const fx=900+i*72,fy=560;if(Math.hypot(x-fx,y-fy)<32)return k;i++;}return null;}
function feed(k){if(pet.eatT>0)return;if(G.st.food>94){pet.refuseT=1;say('full');SFX.sad();return;}
  G.inv[k]--;pet.eatT=1.3;pet.eatK=k;const F=FOODS[k];setStat('food',G.st.food+F.food);if(F.fun)setStat('fun',G.st.fun+F.fun);if(F.dirty){setStat('clean',G.st.clean-F.dirty);syncDirt();}gainXP(12);save();}
function washAt(x,y){
  if(washTool==='soap'){if(!onPet(x,y))return;if(Math.hypot(x-(pet._fx||0),y-(pet._fy||0))<9)return;pet._fx=x;pet._fy=y;
    const u=(x-pet.bx)/(pet.rx*.9),v=(y-pet.by)/(pet.ry*.9);if(foam.length<45)foam.push({u,v,r:rnd(6,12),k:Math.random()*99,p:0});
    for(const d of G.dirt)if(Math.hypot(d.u-u,d.v-v)<.55)d.a-=.22;G.dirt=G.dirt.filter(d=>d.a>0);
    setStat('clean',Math.min(92,Math.max(G.st.clean+1.2,100-13*G.dirt.length-1)));pet.happyT=.4;if(Math.random()<.35)SFX.squeak();if(Math.random()<.04)SFX.giggle();gainXP(.3);}
}
function rinse(x,y,dt){if(Math.random()<.8)addP({type:'drop',x:x+rnd(-26,26),y:y+rnd(0,8),vy:rnd(380,520),vx:rnd(-20,20),life:.9,max:.9,r:rnd(3,5)});
  if(Math.random()<dt*6)SFX.splash();let popped=0;
  foam=foam.filter(f=>{const fx=pet.bx+f.u*pet.rx*.9,fy=pet.by+f.v*pet.ry*.9;if(Math.abs(fx-x)<46&&fy>y){if(Math.random()<dt*9){popped++;addP({type:'bub',x:fx,y:fy,vy:-40,vx:rnd(-30,30),life:.6,max:.6,r:f.r*.7});return false;}}return true;});
  if(popped&&Math.random()<.5)SFX.pop();
  if(!foam.length&&!G.dirt.length&&G.st.clean<100&&pet.shakeT<=0){setStat('clean',100);pet.shakeT=1.2;gainXP(25);SFX.giggle();for(let i=0;i<12;i++)addP({type:'spark',x:pet.bx+rnd(-pet.rx,pet.rx),y:pet.by+rnd(-pet.ry,pet.ry),life:1,max:1,r:rnd(6,11)});save();}}

/* ---------- ball ---------- */
function spawnBall(){ball={x:clamp(pet.x+180*pet.face,120,1160),y:300,vx:0,vy:0,r:22,held:false,rot:0,hitT:0};}
function updBall(dt){if(!ball||ball.held)return;ball.vy+=1500*dt;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.rot+=ball.vx*dt/ball.r;ball.hitT-=dt;
  const fl=PY+10;if(ball.y>fl-ball.r){ball.y=fl-ball.r;if(ball.vy>120)SFX.bonk();ball.vy*=-.55;ball.vx*=.86;if(Math.abs(ball.vy)<60)ball.vy=0;}
  if(ball.x<40+ball.r){ball.x=40+ball.r;ball.vx*=-.7;}if(ball.x>1240-ball.r){ball.x=1240-ball.r;ball.vx*=-.7;}if(ball.y<-200){ball.vy=Math.abs(ball.vy)*.3;}
  if(ball.y>=fl-ball.r-1)ball.vx*=Math.pow(.6,dt);
  // pet heads the ball
  const hx=pet.bx,hy=pet.by-pet.ry*.7,d=Math.hypot(ball.x-hx,ball.y-hy);
  if(d<pet.rx*.75+ball.r&&ball.hitT<=0&&G.st.energy>3){ball.hitT=.35;const a=Math.atan2(ball.y-hy,ball.x-hx);ball.vx=Math.cos(a)*420+rnd(-260,260);ball.vy=-rnd(650,900);
    setStat('fun',G.st.fun+6);setStat('energy',G.st.energy-1.2);gainXP(5);SFX.bonk();SFX.giggle();pet.happyT=.7;addP({type:'spark',x:ball.x,y:ball.y,life:.5,max:.5,r:10});
    if(G.st.clean>30&&Math.random()<.18){setStat('clean',G.st.clean-6);syncDirt();}}
  if(Math.abs(ball.x-pet.x)<140&&ball.y>hy-170&&ball.y<hy&&ball.vy>0&&pet.h<=0&&G.st.energy>3){pet.vh=520;pet.vsq=-1.4;}}

/* ---------- berry catch ---------- */
function startCatch(){if(G.st.energy<15){say('energy');SFX.sad();pet.yawnT=1.2;return;}tool='';playPick=false;ball=null;MODE='catch';
  catchG={t:40,el:0,hearts:3,score:0,coins:0,items:[],spawn:.6,px:640,over:false,keys:{},hurtT:0,mouthT:0};SFX.click();}
function updCatch(dt){const c=catchG;if(c.over)return;c.el+=dt;c.t-=dt;c.hurtT-=dt;c.mouthT-=dt;
  let tx=c.px;const k=c.keys;if(k.a||k.arrowleft)tx-=700*dt;else if(k.d||k.arrowright)tx+=700*dt;else tx=ptr.x;
  c.px=clamp(lerp(c.px,tx,Math.min(1,dt*12)),90,1190);
  c.spawn-=dt;if(c.spawn<=0){c.spawn=Math.max(.32,.85-c.el*.012)*rnd(.7,1.2);const r=Math.random();c.items.push({x:rnd(80,1200),y:-30,vy:rnd(170,230)+c.el*5,k:r<.07?'star':r<.32?'cone':'berry',rot:rnd(0,6),vr:rnd(-3,3)});}
  const s=SCALE[G.stage]*.9,top=650-170*s;
  for(const it of c.items){it.y+=it.vy*dt;it.rot+=it.vr*dt;
    if(!it.done&&it.y>top-10&&it.y<top+70*s&&Math.abs(it.x-c.px)<85*s+18){it.done=true;
      if(it.k==='cone'){c.hearts--;c.hurtT=.8;SFX.hurt();for(let i=0;i<6;i++)addP({type:'crumb',x:it.x,y:it.y,vx:rnd(-160,160),vy:rnd(-260,-80),g:700,life:.7,max:.7,r:5,col:'#7a5133'});if(c.hearts<=0)endCatch();}
      else{const v=it.k==='star'?5:1;c.score++;c.coins+=v;c.mouthT=.25;SFX.chomp();if(v>1)SFX.coin();addP({type:'note',x:it.x,y:it.y-30,vy:-50,life:.8,max:.8,s:'+'+v});}}}
  c.items=c.items.filter(i=>!i.done&&i.y<760);
  if(c.t<=0)endCatch();}
function endCatch(){const c=catchG;c.over=true;c.t=Math.max(0,c.t);G.coins+=c.coins;setStat('fun',G.st.fun+25);setStat('energy',G.st.energy-12);setStat('food',G.st.food-4);gainXP(10+c.score*2);if(c.score>G.best){G.best=c.score;c.best=true;}SFX.yay();save();}

/* ---------- update ---------- */
function update(dt){T+=dt;BF=Math.floor(T*5)%3;music(dt);
  for(const p of parts){p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;p.life-=dt;}parts=parts.filter(p=>p.life>0);
  notes.forEach(n=>{n.t-=dt;n.y-=20*dt;});notes=notes.filter(n=>n.t>0);
  if(banner){banner.t-=dt;if(banner.t<=0)banner=null;}if(bubble){bubble.t-=dt;if(bubble.t<=0)bubble=null;}
  if(MODE==='egg'){egg.wig=Math.max(0,egg.wig-dt*2.5);if(egg.hatchT){egg.hatchT+=dt;if(egg.hatchT>.6)hatch();}return;}
  if(MODE==='catch'){updCatch(dt);petAnim(dt);return;}
  if(MODE!=='room'&&MODE!=='name'){return;}
  // stats
  if(MODE==='room'){const s=G.st;
    if(pet.asleep){setStat('energy',s.energy+1.6*dt);setStat('food',s.food-.012*dt);if(s.energy>=100){wake();banner={s:G.name+' woke up',sub:'all rested',t:2.5};}gainXP(.25*dt);}
    else{setStat('food',s.food-.035*dt);setStat('clean',s.clean-(tool==='wash'?0:.02)*dt);setStat('fun',s.fun-(tool==='play'?0:.045)*dt);setStat('energy',s.energy-.018*dt);
      const m=mood();if(m>=50)gainXP(.5*dt);else if(m>=30)gainXP(.2*dt);}
    if(tool!=='wash')syncDirt();
    saveT+=dt;if(saveT>5){saveT=0;save();}}
  // pet target
  if(tool==='wash'){pet.tx=640;}else if(tool==='sleep'){pet.tx=215;}else if(tool==='feed'){pet.tx=740;}
  else if(tool==='play'&&ball){pet.tx=clamp(ball.x-pet.face*10,90,1190);}
  else{pet.wanderT-=dt;if(pet.wanderT<=0){pet.wanderT=rnd(2.5,6);pet.tx=Math.random()<.35?pet.x:rnd(330,1000);if(Math.random()<.25&&!pet.asleep)SFX.chirp(rnd(.9,1.15));}}
  if(pet.petting>0&&!tool){pet.tx=pet.x;}

  list.forEach((k,i)=>{const col=i%3,row=Math.floor(i/3),ix=x-240+col*240,iy=y-80+row*150;
    wrect(ix-100,iy-55,200,135,990+i,1.6);fillInk('#fffaf0',2.4);
    if(shopTab==='food'){drawFood(k,ix-40,iy-8,30);txt(FOODS[k].n,ix+30,iy-26,25,INK,'center');txt('have '+G.inv[k],ix+30,iy+2,20,'rgba(58,42,34,.65)');
      const can=G.coins>=FOODS[k].price;buyBtn(ix,iy+52,FOODS[k].price,can,()=>{G.coins-=FOODS[k].price;G.inv[k]++;SFX.coin();save();});}
    else{const own=G.hats[k],wear=G.hat===k;cx.save();cx.translate(ix-42,iy+16);drawHat(k,0,0,.55);cx.restore();txt(HATS[k].n,ix+32,iy-22,24);
      if(own){wrect(ix-56,iy+34,112,36,1000+i,1.2);fillInk(wear?'#f3d58a':PAPER,2.4);txt(wear?'take off':'wear',ix,iy+52,23);UI.push({x:ix-56,y:iy+34,w:112,h:36,fn:()=>{G.hat=wear?'':k;SFX.click();pet.happyT=.6;save();}});}
      else buyBtn(ix,iy+52,HATS[k].price,G.coins>=HATS[k].price,()=>{G.coins-=HATS[k].price;G.hats[k]=1;G.hat=k;SFX.coin();SFX.giggle();pet.happyT=1;save();});}});
  txt(shopTab==='food'?'earn berries in berry catch, then spend them here':'hats show up on '+(G.name||'your fuzzling')+' right away',x,y+188,22,'rgba(58,42,34,.6)');}
function buyBtn(x,y,price,can,fn){wrect(x-56,y-18,112,36,x+y,1.2);fillInk(can?'#f3d58a':'#ece0cb',2.4);cx.globalAlpha=can?1:.45;IC.coin(x-22,y,10);txt(String(price),x+4,y,24,INK,'left');cx.globalAlpha=1;
  UI.push({x:x-56,y:y-18,w:112,h:36,fn:can?fn:()=>{SFX.bonk();}});}
function drawBubble(){if(!bubble||MODE!=='room')return;const x=pet.bx+pet.face*pet.rx*.9+50,y=pet.by-pet.ry-40;
  circ(pet.bx+pet.face*pet.rx*.7,pet.by-pet.ry*.9,6);fillInk(PAPER,2);circ(pet.bx+pet.face*pet.rx*.8+18,pet.by-pet.ry-14,9);fillInk(PAPER,2);
  blob(x,y,44,36,1100,1.4,18);fillInk(PAPER,2.6);const ic=bubble.icon;if(ic==='full'||ic==='nope')IC[ic](x,y,20);else if(IC[ic])IC[ic](x,y,20);}
function drawParts(){for(const p of parts){const a=clamp(p.life/p.max,0,1);cx.globalAlpha=Math.min(1,a*1.6);
  if(p.type==='heart')IC.heart(p.x,p.y,p.r);
  else if(p.type==='crumb'){circ(p.x,p.y,p.r);cx.fillStyle=p.col;cx.fill();}
  else if(p.type==='drop'){blob(p.x,p.y,p.r*.8,p.r*1.3,p.x|0,.3,8);cx.fillStyle='#8cc3dc';cx.fill();}
  else if(p.type==='bub'){circ(p.x,p.y,p.r);ink(1.6,'#8fb8cc');}
  else if(p.type==='spark'){cx.save();cx.translate(p.x,p.y);cx.rotate(T*3);cx.beginPath();for(let i=0;i<8;i++){const r=i%2?p.r*.35:p.r;cx.lineTo(Math.cos(i/8*TAU)*r,Math.sin(i/8*TAU)*r);}cx.closePath();fillInk('#f6dc7a',1.6);cx.restore();}
  else if(p.type==='conf'){cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillStyle=p.col;cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);cx.restore();}
  else if(p.type==='shell'){cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.beginPath();cx.moveTo(-p.r,0);cx.lineTo(0,-p.r*.8);cx.lineTo(p.r,-p.r*.2);cx.lineTo(p.r*.3,p.r*.7);cx.closePath();fillInk('#f6ecd4',2);cx.restore();}
  else if(p.type==='z'){txt('z',p.x,p.y,p.r,'rgba(240,226,190,.95)');}
  else if(p.type==='note'){txt(p.s,p.x,p.y,30,'#5a3d1f');}
  cx.globalAlpha=1;}
  for(const n of notes){cx.globalAlpha=clamp(n.t,0,1);txt(n.s,n.x,n.y,26);cx.globalAlpha=1;}}
function drawBall(){if(!ball)return;cx.fillStyle='rgba(58,42,34,.18)';cx.beginPath();cx.ellipse(ball.x,PY+12,ball.r*(1-Math.min(1,(PY+10-ball.y)/600)*.6),6,0,0,TAU);cx.fill();
  cx.save();cx.translate(ball.x,ball.y);cx.rotate(ball.rot);circ(0,0,ball.r);fillInk('#e36b5d',3);cx.save();circ(0,0,ball.r);cx.clip();cx.beginPath();cx.arc(-ball.r*1.1,0,ball.r,-.9,.9);ink(8,'#f6e3c0');cx.beginPath();cx.arc(ball.r*1.1,0,ball.r,Math.PI-.9,Math.PI+.9);ink(8,'#f6e3c0');cx.restore();circ(0,0,ball.r);ink(3);cx.restore();
  if(!ball.held&&Math.abs(ball.vx)<5&&ball.vy===0)txt('drag and throw',ball.x,ball.y-46,22,'rgba(58,42,34,.6)');}
function drawName(){cx.fillStyle='rgba(42,30,24,.25)';cx.fillRect(-OX/S,-OY/S,W/S,H/S);
  cx.save();cx.translate(640,250);cx.rotate(.01);wrect(-270,-110,540,250,1200,2.5);fillInk('#fbf3e3',3.5);cx.restore();
  txt('what should we call it?',640,180,34);
  COLS.forEach((c,i)=>{const x=640-105+i*70,y=318;circ(x,y,22);fillInk(c.b,G.col===i?4.2:2.6);if(G.col===i){circ(x,y,30);ink(2,'rgba(58,42,34,.5)');}UI.push({x,y,r:26,fn:()=>{G.col=i;SFX.click();pet.happyT=.5;}});});
  wrect(560,354,160,46,1210,1.4);fillInk('#f3d58a',2.6);txt("that's it",640,377,28);UI.push({x:560,y:354,w:160,h:46,fn:confirmName});}

/* ---------- berry catch drawing ---------- */
function drawMeadow(){const L=-OX/S-2,Tp=-OY/S-2,R=(W-OX)/S+2,B=(H-OY)/S+2;const g=cx.createLinearGradient(0,Tp,0,560);g.addColorStop(0,'#a9d4e4');g.addColorStop(1,'#e8f0d8');cx.fillStyle=g;cx.fillRect(L,Tp,R-L,B-Tp);
  circ(1080,120,46);fillInk('#f8dc7a',3);
  for(let i=0;i<4;i++){const x=((T*12+i*360)%(R-L+300))+L-150,y=90+i*40;cx.fillStyle='rgba(255,255,255,.9)';blob(x,y,60,20,1300+i,1.5,16);cx.fill();blob(x+34,y-12,36,18,1310+i,1,14);cx.fill();}
  cx.beginPath();cx.moveTo(L,470);cx.quadraticCurveTo(250,360,560,450);cx.quadraticCurveTo(860,380,R,440);cx.lineTo(R,B);cx.lineTo(L,B);cx.closePath();fillInk('#a8cf8e',3);
  cx.beginPath();cx.moveTo(L,560);cx.quadraticCurveTo(400,490,800,550);cx.quadraticCurveTo(1050,510,R,540);cx.lineTo(R,B);cx.lineTo(L,B);cx.closePath();fillInk('#86b673',3);
  for(const [bx,by,r] of[[150,470,50],[1150,455,60],[420,560,40]]){blob(bx,by,r,r*.75,1320+bx,2,18);fillInk('#6f9d5f',3);for(let i=0;i<4;i++){circ(bx-r*.5+i*r*.33,by-r*.2+(i%2)*10,5);fillInk('#e36b5d',1.5);}}
  for(let x=Math.floor(L/26)*26;x<R;x+=26){const h=10+H1(x)*12;wline(x,708,x+wb(x,3)+4,708-h,x,2,'rgba(58,42,34,.45)',1);}}
function drawCatch(){const c=catchG;drawMeadow();
  for(const it of c.items){cx.save();cx.translate(it.x,it.y);cx.rotate(it.rot);
    if(it.k==='berry')drawFood('berries',0,0,22);
    else if(it.k==='star'){cx.beginPath();for(let i=0;i<10;i++){const r=i%2?11:26;cx.lineTo(Math.cos(i/10*TAU-Math.PI/2)*r,Math.sin(i/10*TAU-Math.PI/2)*r);}cx.closePath();fillInk('#f6d35a',3);}
    else{blob(0,0,16,24,1400,1,14);fillInk('#8a5a36',3);for(let i=-1;i<=1;i++)wline(-12,i*9,12,i*9+4,1401+i,2,'rgba(58,42,34,.6)');}
    cx.restore();}
  pet.x=c.px;if(c.hurtT>0&&Math.sin(T*40)>0)cx.globalAlpha=.5;drawPet(c.px,690,SCALE[G.stage]*.9,{noFlies:true});cx.globalAlpha=1;
  // hud
  for(let i=0;i<3;i++){cx.globalAlpha=i<c.hearts?1:.25;IC.heart(1120+i*44,48,15);cx.globalAlpha=1;}
  wrect(560,22,160,56,1410,1.5);fillInk(PAPER,3);txt(Math.ceil(c.t)+'',640,50,40);
  IC.coin(820,50,16);txt('+'+c.coins,844,50,32,INK,'left');
  if(c.el<3&&!c.over)txt('move with the mouse or A / D  ·  catch berries, dodge the pinecones',640,130,26,'rgba(58,42,34,.8)');
  if(c.over){cx.fillStyle='rgba(42,30,24,.3)';cx.fillRect(-OX/S,-OY/S,W/S,H/S);cx.save();cx.translate(640,320);cx.rotate(-.015);wrect(-250,-140,500,280,1420,2.5);fillInk('#fbf3e3',3.5);cx.restore();
    txt(c.hearts<=0?'ouch, pinecones':'time is up',640,215,38);txt(c.score+' caught',640,268,30);IC.coin(608,312,16);txt('+'+c.coins,630,312,32,INK,'left');
    if(c.best)txt('new best!',640,350,24,'#c75d4a');
    const canAgain=G.st.energy>=15;
    wrect(440,385,170,50,1430,1.4);fillInk(canAgain?'#f3d58a':'#ece0cb',2.6);txt(canAgain?'again':'too sleepy',525,410,28);if(canAgain)UI.push({x:440,y:385,w:170,h:50,fn:()=>{MODE='room';startCatch();}});
    wrect(670,385,170,50,1431,1.4);fillInk(PAPER,2.6);txt('home',755,410,28);UI.push({x:670,y:385,w:170,h:50,fn:()=>{MODE='room';catchG=null;pet.x=pet.tx=640;SFX.click();}});}
  drawParts();}

/* ---------- frame ---------- */
let lastT=performance.now();
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-lastT)/1000);lastT=now;update(dt);
  UI=[];cx.setTransform(DPR,0,0,DPR,0,0);cx.fillStyle='#2a201b';cx.fillRect(0,0,W,H);cx.setTransform(DPR*S,0,0,DPR*S,DPR*OX,DPR*OY);
  if(MODE==='catch'){drawCatch();}
  else{drawRoom();
    if(MODE==='egg'){drawEgg(640,470);txt(egg.cracks?'keep tapping…':'tap the egg',640,300+Math.sin(T*3)*4,34);drawParts();}
    else{if(tool==='wash')drawTub(true);
      const s=SCALE[G.stage]||.6;drawPet(pet.x,PY,s);
      if(tool==='wash')drawTub(false);drawBall();drawBubble();
      if(tool==='feed')drawFeedTray();
      if(pet.asleep){const L=-OX/S,Tp=-OY/S;cx.fillStyle='rgba(18,22,48,.5)';cx.fillRect(L,Tp,W/S,H/S);const g=cx.createRadialGradient(320,215,10,320,215,260);g.addColorStop(0,'rgba(255,210,120,.28)');g.addColorStop(1,'rgba(255,210,120,0)');cx.fillStyle=g;cx.fillRect(60,0,520,480);}
      else if(skyCol()[2]===2){cx.fillStyle='rgba(30,34,70,.16)';cx.fillRect(-OX/S,-OY/S,W/S,H/S);}
      drawParts();
      if(drag&&drag.k)drawFood(drag.k,drag.x,drag.y,30);
      if(MODE==='name')drawName();
      else{drawHUD();if(tool==='wash')drawWashUI();drawPlayPick();if(tool==='shop')drawShop();}}}
  // paper grain + vignette over everything
  cx.setTransform(DPR,0,0,DPR,0,0);cx.globalAlpha=.55;cx.fillStyle=grain;cx.fillRect(0,0,W,H);cx.globalAlpha=1;
  const vg=cx.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.75);vg.addColorStop(0,'rgba(60,35,20,0)');vg.addColorStop(1,'rgba(60,35,20,.28)');cx.fillStyle=vg;cx.fillRect(0,0,W,H);}
resize();
if(MODE==='name')openName();
document.fonts&&document.fonts.load('30px "Patrick Hand"').catch(()=>{});
requestAnimationFrame(frame);
setInterval(save,15000);
</script>
